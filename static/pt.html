<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health</title>
<link rel="icon" href="/static/logo/pt.svg" type="image/svg+xml">
<link rel="manifest" href="/static/pt.webmanifest">
<link rel="apple-touch-icon" href="/static/pt-ikon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Health (2026-10-25): kişisel antrenör + diyetisyen. Telefon önce: altta sekme çubuğu (Bugün · Plan · Beslenme · İlerleme · Siz), tam ekran oynatıcı.
   Tanıtım filmlerinin dili (v20): koyu, ince çizgi, mono etiket, noktalı çizgi; vurgu limon yeşili. Tek birincil düğme, başlık düz ad. */
:root{
  --bg:#08080a; --yuzey:#111114; --yuzey2:#18181c; --yuzey3:#202026; --cizgi:rgba(255,255,255,.1); --cizgi2:rgba(255,255,255,.2);
  --ink:#f2f2f4; --ink2:#a1a1aa; --ink3:#6b6b74; --vurgu:#C4F23A; --vurgu-ink:#142004; --vurgu-rgb:196,242,58;
  --yesil:#34c77b; --sari:#ffcc33; --turuncu:#ff9f43; --kirmizi:#ff5d5d; --mavi:#6e8cff; --mono:'Geist Mono',ui-monospace,Menlo,monospace; --r:16px;
  --ust:env(safe-area-inset-top,0px); --alt:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f6f6f3; --yuzey:#fff; --yuzey2:#f0f0ec; --yuzey3:#e6e6e0; --cizgi:rgba(0,0,0,.09); --cizgi2:rgba(0,0,0,.18);
  --ink:#1c1c1e; --ink2:#5b5b63; --ink3:#8e8e96; --vurgu:#5C8A00; --vurgu-ink:#fff; --vurgu-rgb:92,138,0; --sari:#c99400; --mavi:#3b63e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0),radial-gradient(ellipse 80% 40% at 50% -10%,rgba(var(--vurgu-rgb),.10),transparent 70%);background-size:22px 22px,100% 100%;background-attachment:fixed}
:root[data-theme="light"] body{background-image:radial-gradient(circle at 1px 1px,rgba(0,0,0,.05) 1px,transparent 0),radial-gradient(ellipse 80% 40% at 50% -10%,rgba(var(--vurgu-rgb),.12),transparent 70%)}
a{color:inherit} button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid rgba(var(--vurgu-rgb),.8);outline-offset:2px}
.hidden{display:none!important}
.gri{color:var(--ink3)} .gri2{color:var(--ink2)}
.mono{font-size:13px;color:var(--ink3);font-weight:600}
/* üst çubuk */
.nav{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(56px + var(--ust));padding:var(--ust) 16px 0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--cizgi)}
.markaGrup{grid-column:2;position:relative;display:flex;align-items:center;gap:2px}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);padding:6px 8px;border-radius:10px}
.brand img{width:24px;height:24px;border-radius:6px;display:block}
.brand .bt{font:700 15px/1 Geist,-apple-system,system-ui,sans-serif;letter-spacing:.18em}
.brand .alt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink3)}
.urunbtn{width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--ink2);display:grid;place-items:center}
.urunbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.urunMenu{display:none;position:absolute;top:44px;left:50%;transform:translateX(-50%);background:var(--yuzey);border:1px solid var(--cizgi2);border-radius:16px;box-shadow:0 24px 60px -12px rgba(0,0,0,.55);padding:8px;z-index:40;min-width:200px}
.urunMenu.acik{display:block}
.urunMenu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);font-weight:500;text-decoration:none}
.urunMenu a:hover,.urunMenu a.on{background:var(--yuzey2)}
.urunMenu img{width:22px;height:22px;border-radius:6px}
.navsag{grid-column:3;justify-self:end;display:flex;gap:6px;align-items:center}
.tema{border:1px solid var(--cizgi);background:none;border-radius:99px;width:32px;height:32px;color:var(--ink2)}
.navsol{grid-column:1;justify-self:start;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink3)}
@media (max-width:600px){.navsol span:not(.donen):not(.mono){display:none}}
/* sekme çubuğu: telefonda altta, geniş ekranda üstte */
.sekmeler{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--alt));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--cizgi)}
.sekmeler button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--ink3);font-size:11px;font-weight:600;border-radius:12px}
.sekmeler svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sekmeler button.on{color:var(--vurgu)}
@media (min-width:900px){.sekmeler{position:sticky;top:calc(56px + var(--ust));bottom:auto;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--cizgi);padding:6px}
  .sekmeler button{flex:none;flex-direction:row;gap:8px;padding:8px 14px;font-size:14px;max-width:none} .sekmeler button.on{background:var(--yuzey2)} .sekmeler svg{width:18px;height:18px}}
main{max-width:720px;margin:0 auto;padding:18px 16px calc(96px + var(--alt))}
@media (min-width:900px){main{padding-bottom:60px}}
/* öğeler */
.btn{border-radius:99px;padding:11px 18px;font-weight:600;font-size:15px;background:var(--yuzey2);color:var(--ink);border:1px solid var(--cizgi);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn.ana{background:var(--vurgu);color:var(--vurgu-ink);border-color:transparent;box-shadow:0 0 0 1px rgba(var(--vurgu-rgb),.4),0 8px 30px -10px rgba(var(--vurgu-rgb),.55)}
.btn.genis{width:100%}
.btn.kucuk{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.4;box-shadow:none}
.metin{background:none;border:0;color:var(--vurgu);font-weight:600;padding:4px 2px;font-size:14px;text-decoration:none}
.metin.red{color:var(--kirmizi)} .metin.sessiz{color:var(--ink3)}
.kart{border:1px solid var(--cizgi);border-radius:var(--r);background:var(--yuzey);padding:16px;margin-bottom:12px}
.kart.vurgulu{border-color:rgba(var(--vurgu-rgb),.45);box-shadow:0 0 0 1px rgba(var(--vurgu-rgb),.12),0 20px 50px -30px rgba(var(--vurgu-rgb),.6)}
.kbas{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.kbas h3{margin:0;font-size:17px;letter-spacing:-.01em}
h1.bas{font-size:30px;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.1}
h1.bas span{color:var(--ink3);font-weight:500}
.alti{color:var(--ink2);margin:0 0 16px;font-size:14px}
h2.bolum{font-size:19px;letter-spacing:-.02em;margin:26px 0 10px}
h2.bolum span{color:var(--ink3);font-weight:500}
.alan{width:100%;border:1px solid var(--cizgi2);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;outline:none;resize:vertical}
.alan:focus{border-color:rgba(var(--vurgu-rgb),.7)}
input.alan.kisa{width:96px} input.alan.orta{width:150px}
.etk{display:block;font-size:13px;color:var(--ink2);margin:12px 0 6px;font-weight:600}
.satir{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.satir.ara{justify-content:space-between}
.seg{display:inline-flex;background:var(--yuzey2);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--yuzey);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cipler button{border:1px solid var(--cizgi2);background:none;border-radius:99px;padding:7px 12px;font-size:14px;color:var(--ink2)}
.cipler button.on{background:var(--vurgu);border-color:transparent;color:var(--vurgu-ink);font-weight:600}
.sayac{display:inline-flex;align-items:center;gap:0;border:1px solid var(--cizgi2);border-radius:99px;overflow:hidden}
.sayac button{border:0;background:none;width:38px;height:36px;font-size:18px;color:var(--ink2)}
.sayac b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.rozet{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--cizgi2);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.rozet i{width:7px;height:7px;border-radius:50%;background:currentColor}
.rozet.yesil{color:var(--yesil);border-color:rgba(52,199,123,.5)} .rozet.sari{color:var(--sari);border-color:rgba(255,204,51,.5)} .rozet.kirmizi{color:var(--kirmizi);border-color:rgba(255,93,93,.5)} .rozet.vurgu{color:var(--vurgu);border-color:rgba(var(--vurgu-rgb),.5)} .rozet.turuncu{color:var(--turuncu);border-color:rgba(255,159,67,.5)}
.donen{width:16px;height:16px;border-radius:50%;border:2px solid rgba(var(--vurgu-rgb),.3);border-top-color:var(--vurgu);animation:don .8s linear infinite;display:inline-block;flex:none}
@keyframes don{to{transform:rotate(360deg)}}
.not{font-size:13.5px;color:var(--ink2);border-left:2px solid rgba(var(--vurgu-rgb),.6);padding:2px 0 2px 10px;margin:8px 0}
.not.uyari{border-color:var(--turuncu)} .not.kirmizi{border-color:var(--kirmizi);color:var(--ink)}
.liste{display:flex;flex-direction:column}
.lsatir{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--cizgi)}
.lsatir:last-child{border:0}
.kucukresim{width:52px;height:52px;border-radius:10px;background:var(--yuzey2);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--ink3);font-size:11px;overflow:hidden}
.lgovde{flex:1;min-width:0} .lgovde b{display:block;font-weight:600;font-size:15px;line-height:1.3} .lgovde small{color:var(--ink3);font-size:13px}
.ilerleme{height:8px;border-radius:99px;background:var(--yuzey3);overflow:hidden}
.ilerleme i{display:block;height:100%;background:var(--vurgu);border-radius:99px;transition:width .4s}
.sayi{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sayi small{font-size:14px;color:var(--ink3);font-weight:500}
.izgara2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--alt));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:90;display:flex;gap:12px;align-items:center;box-shadow:0 10px 40px -10px rgba(0,0,0,.6);max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--vurgu);font-weight:700;padding:0}
:root[data-theme="light"] .toast button{color:#C4F23A}
/* alttan açılan sayfa */
.perde{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sayfa{background:var(--yuzey);border:1px solid var(--cizgi2);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:8px 18px calc(22px + var(--alt));animation:yuksel .22s ease-out}
@media (min-width:700px){.perde{align-items:center}.sayfa{border-radius:22px;border-bottom:1px solid var(--cizgi2);max-height:86vh}}
@keyframes yuksel{from{transform:translateY(30px);opacity:.4}}
.sayfa .tutac{width:38px;height:5px;border-radius:9px;background:var(--cizgi2);margin:4px auto 10px}
.sayfa h3{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.sayfa .salt{display:flex;gap:10px;margin-top:18px}
.sayfa .salt .btn{flex:1}
/* pencere halkası */
.halka{position:relative;width:86px;height:86px;flex:none}
.halka svg{width:86px;height:86px;transform:rotate(-90deg)}
.halka .ic{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:10.5px;line-height:1.15;color:var(--ink2)}
.halka .ic b{display:block;font-size:15px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
/* gün kartı */
.gunbas{display:flex;align-items:center;gap:10px}
.turikon{width:42px;height:42px;border-radius:12px;background:rgba(var(--vurgu-rgb),.12);color:var(--vurgu);display:grid;place-items:center;flex:none}
.turikon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hareketsir{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.hareketsir::-webkit-scrollbar{display:none}
.hk{flex:none;width:86px;font-size:12px;color:var(--ink2);line-height:1.25}
.hk .kucukresim{width:86px;height:86px;margin-bottom:5px}
.hk .kucukresim.yok{border:1px dashed var(--cizgi2);background:none}
.hk[data-hk]{cursor:pointer}
.kasfoto{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:2px}
.kasfoto figure{margin:0} .kasfoto img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:#0b0b0d;display:block}
.kasfoto figcaption{font-size:12.5px;color:var(--ink2);margin-top:4px;text-align:center}
.kasyazi{margin-top:6px;font-size:14px} .kasyazi b{display:block;font-weight:600} .kasyazi span{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.sb{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#d9d7d2;cursor:pointer}
.sb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease} .sb img.on{opacity:1}
.sb-nok{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px} .sb-nok i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.25)} .sb-nok i.on{background:rgba(0,0,0,.7)}
.sb-ad{position:absolute;right:10px;top:8px;font-size:10.5px;color:rgba(0,0,0,.5)}
.oyn .sb.oynsb{position:absolute;inset:0;width:auto;aspect-ratio:auto;border-radius:0;background:#000} .oyn .sb.oynsb img{object-fit:contain}
.oyn .sb.oynsb .sb-nok i{background:rgba(255,255,255,.3)} .oyn .sb.oynsb .sb-nok i.on{background:#fff} .oyn .sb.oynsb .sb-ad{color:rgba(255,255,255,.5)}
.hkart .adimlar li.fotolu{cursor:pointer;align-items:center} .hkart .adimlar li img{width:84px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;opacity:.55;transition:opacity .3s}
.hkart .adimlar li.fotolu.on img{opacity:1;outline:2px solid var(--vurgu);outline-offset:1px} .hkart .adimlar li.fotolu::before{display:none}
.yt{display:block;position:relative;width:100%;aspect-ratio:16/9;border:0;border-radius:14px;overflow:hidden;background:#000;padding:0;cursor:pointer}
.yt img{width:100%;height:100%;object-fit:cover;opacity:.85} .yt-oy{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.yt-bilgi{margin-top:6px;font-size:13.5px} .yt-bilgi span{display:block;font-weight:600} .yt-bilgi small{color:var(--ink2);font-size:12.5px} .yt-bilgi a{color:var(--vurgu)}
.takviye{border-top:1px solid var(--cizgi);padding:9px 0} .takviye summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none} .takviye summary::after{content:'＋';float:right;color:var(--ink3)} .takviye[open] summary::after{content:'−'} .takviye p{margin:6px 0 0;font-size:14px;color:var(--ink2)}
.sizbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--cizgi2);background:var(--yuzey2);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer}
.sizbtn.on{background:var(--vurgu);color:var(--vurgu-ink);border-color:var(--vurgu)}
.blokserit{display:flex;gap:12px;align-items:center;border:1px solid var(--cizgi);border-radius:14px;padding:10px 12px;margin:0 0 14px}
.blokserit .bs{display:flex;gap:3px;flex:none} .blokserit .bs i{width:8px;height:22px;border-radius:3px;background:var(--yuzey3)} .blokserit .bs i.g{background:rgba(var(--vurgu-rgb),.45)} .blokserit .bs i.on{background:var(--vurgu)}
.blokserit b{display:block;font-size:14px} .blokserit small{display:block;color:var(--ink2);font-size:12.5px}
.hafiza .lsatir{align-items:flex-start} .hafiza .sil{background:none;border:0;color:var(--ink3);font-size:15px;cursor:pointer;padding:2px 6px}
.akis{display:flex;flex-direction:column;margin-top:2px;position:relative}
.akisoge{display:grid;grid-template-columns:46px 22px 1fr;gap:8px;align-items:start;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:8px 0;cursor:pointer;position:relative}
.akisoge .as{font:12px var(--mono);color:var(--ink3);padding-top:2px;font-variant-numeric:tabular-nums}
.akisoge .ai{width:22px;height:22px;border-radius:50%;border:1px solid var(--cizgi2);display:grid;place-items:center;font-size:11px;color:var(--ink3);background:var(--yuzey)}
.akisoge .am b{display:block;font-weight:600;font-size:14.5px} .akisoge .am small{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}
.akisoge.bitti .am b{color:var(--ink3);font-weight:500;text-decoration:line-through;text-decoration-color:var(--cizgi2)} .akisoge.bitti .ai{color:var(--vurgu);border-color:rgba(var(--vurgu-rgb),.5)}
.akisoge.simdi .ai{border-color:var(--vurgu);color:var(--vurgu-ink);background:var(--vurgu);box-shadow:0 0 0 4px rgba(var(--vurgu-rgb),.18)}
.akisoge.simdi .as{color:var(--vurgu)}
.akisoge.gecti:not(.bitti) .am b{color:var(--ink2)}
.akis::before{content:'';position:absolute;left:65px;top:16px;bottom:16px;border-left:1px dashed var(--cizgi2)}
.onaykutu{width:38px;height:38px;flex:none;border-radius:12px;border:1.5px solid var(--cizgi2);background:none;color:var(--vurgu-ink);font-weight:700;font-size:18px;cursor:pointer}
.onaykutu.on{background:var(--vurgu);border-color:var(--vurgu)}
.dugmesatir{width:100%;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer;align-items:center}
.kutlama{border-color:rgba(var(--vurgu-rgb),.45);background:linear-gradient(135deg,rgba(var(--vurgu-rgb),.12),transparent 60%)}
.hkart video,.hkart .vyok{width:100%;aspect-ratio:16/9;border-radius:14px;background:#0b0b0d;object-fit:cover;display:block}
.hkart .vyok{display:grid;place-items:center;color:var(--ink3);font-size:13.5px;text-align:center;padding:16px}
.hkart .adimlar{list-style:none;padding:0;margin:4px 0 0;counter-reset:a}
.hkart .adimlar li{counter-increment:a;display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px;line-height:1.4}
.hkart .adimlar li::before{content:counter(a);flex:none;width:22px;height:22px;border-radius:50%;background:rgba(var(--vurgu-rgb),.16);color:var(--vurgu);font:600 12px/22px var(--mono);text-align:center}
.hkart .hata{display:flex;gap:8px;font-size:14px;color:var(--ink2);padding:3px 0}
.hkart .hata::before{content:'✕';color:var(--kirmizi);font-weight:700;flex:none}
.komsu{display:flex;gap:8px;margin-top:4px}
.komsu button{flex:1;text-align:left;background:var(--yuzey2);border:1px solid var(--cizgi);border-radius:12px;padding:9px 11px;color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer}
.komsu button span{display:block;font:10.5px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.oyn .adimkisa{font-size:13.5px;color:rgba(255,255,255,.72);margin:6px auto 0;max-width:420px;text-align:left;line-height:1.45}
.oyn .adimkisa div{display:flex;gap:7px} .oyn .adimkisa div b{color:var(--vurgu);font-weight:600;flex:none}
/* hafta */
.hafta{display:flex;flex-direction:column;gap:0;position:relative}
.hgun{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--cizgi);position:relative}
.hgun .tar{font-family:var(--mono);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;line-height:1.3}
.hgun .tar b{display:block;font-family:Geist;font-size:20px;color:var(--ink);letter-spacing:-.02em;text-transform:none}
.hgun.bugun .tar b{color:var(--vurgu)}
.hgun.gecti{opacity:.55}
.hgun .bitti{color:var(--yesil);font-weight:700}
.hacik{grid-column:1/-1;padding:4px 0 6px 66px}
.bolumad{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:10px 0 4px}
.hsatir{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.hsatir span:last-child{color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
/* beceri yolu */
.yol{display:flex;align-items:center;gap:0;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.yol::-webkit-scrollbar{display:none}
.dug{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;font-size:11.5px;text-align:center;color:var(--ink3);line-height:1.2}
.dug i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--cizgi2);background:var(--bg)}
.dug.gecti i{background:var(--yesil);border-color:var(--yesil)} .dug.gecti{color:var(--ink2)}
.dug.simdi i{background:var(--vurgu);border-color:var(--vurgu);box-shadow:0 0 12px rgba(var(--vurgu-rgb),.7)} .dug.simdi{color:var(--ink);font-weight:600}
.cz{flex:none;width:18px;height:0;border-top:1.5px dashed var(--cizgi2);margin-bottom:22px}
.cz.dolu{border-color:var(--yesil);border-top-style:solid}
/* takvim ısı haritası */
.isi{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,9px);gap:2px;justify-content:start}
.isi i{width:9px;height:9px;border-radius:2px;background:var(--yuzey3)}
.isi i.d1{background:rgba(var(--vurgu-rgb),.35)} .isi i.d2{background:rgba(var(--vurgu-rgb),.65)} .isi i.d3{background:var(--vurgu)}
/* yemek */
.tabak{width:100%;border-collapse:collapse;font-size:14px}
.tabak td{padding:5px 4px;border-bottom:1px solid var(--cizgi);vertical-align:middle}
.tabak input{width:100%;background:none;border:0;color:var(--ink);font:inherit;padding:2px 0;outline:none}
.tabak input.s{width:54px;text-align:right;font-variant-numeric:tabular-nums}
.tabak th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;font-weight:500;padding:4px}
.foto-al{display:flex;gap:8px;align-items:center}
.foto-al label{border:1px dashed var(--cizgi2);border-radius:14px;padding:12px 14px;flex:1;text-align:center;color:var(--ink2);cursor:pointer;font-weight:600}
.foto-al img{width:64px;height:64px;border-radius:12px;object-fit:cover}
svg.grafik{width:100%;height:150px;display:block}
.grafik .ham{fill:var(--ink3)} .grafik .tr{fill:none;stroke:var(--vurgu);stroke-width:2.2}
.grafik .eks{stroke:var(--cizgi);stroke-width:1} .grafik text{fill:var(--ink3);font-size:10px;font-family:var(--mono)}
/* oynatıcı */
.oyn{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column}
.oyn .ust{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--ust)) 16px 8px;gap:10px;position:relative;z-index:2}
.oyn .ust .mono{color:rgba(255,255,255,.6)}
.oyn .kapat{border:0;background:rgba(255,255,255,.12);color:#fff;width:36px;height:36px;border-radius:99px;font-size:17px}
.oyn .cubuk{height:3px;background:rgba(255,255,255,.12);margin:0 16px;border-radius:9px;overflow:hidden}
.oyn .cubuk i{display:block;height:100%;background:var(--vurgu);transition:width .3s}
.oyn .sahne{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.oyn video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.oyn .videoyok{color:rgba(255,255,255,.45);text-align:center;padding:24px;font-size:15px}
.oyn .videoyok b{display:block;color:#fff;font-size:24px;margin-bottom:6px}
.oyn .alt{padding:14px 18px calc(18px + var(--alt));background:linear-gradient(transparent,rgba(0,0,0,.85) 25%);position:relative;z-index:2}
.oyn .had{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.oyn .hed{font-size:15px;color:rgba(255,255,255,.7);margin-top:2px}
.oyn .zaman{font-size:76px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0 6px}
.oyn .zaman.dinlen{color:var(--vurgu)}
.oyn .sonraki{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.65);font-size:13.5px;margin:6px 0 12px}
.oyn .sonraki img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#222}
.oyn .dug2{display:flex;gap:10px;align-items:center}
.oyn .dug2 .btn{flex:1;padding:16px;font-size:17px}
.oyn .btn{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
.oyn .btn.ana{background:var(--vurgu);color:#142004}
.oyn .yuvarlak{width:56px;height:56px;border-radius:99px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:15px;font-weight:700;flex:none}
.oyn .tekrarsec{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 12px}
.oyn .tekrarsec button{width:52px;height:52px;border-radius:99px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px}
.oyn .tekrarsec b{font-size:60px;font-weight:800;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
.oyn .zorsec{display:flex;gap:8px;margin-bottom:10px}
.oyn .zorsec button{flex:1;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:99px;padding:10px;font-weight:600}
.oyn .zorsec button.on{background:#fff;color:#000}
.oyn .ipucu{font-size:13.5px;color:rgba(255,255,255,.6);margin-top:4px}
.oyn .kucukdug{border:0;background:none;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;padding:4px 6px}
/* harita */
#harita{height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--cizgi);margin:10px 0;z-index:1}
.leaflet-container{background:var(--yuzey2)}
.rotasec{display:flex;flex-direction:column;gap:8px}
.rotasec button{text-align:left;border:1px solid var(--cizgi2);background:none;border-radius:14px;padding:11px 13px;font-size:14px;color:var(--ink2)}
.rotasec button.on{border-color:var(--vurgu);color:var(--ink)}
.rotasec button b{color:var(--ink);display:block;font-size:15px}
.md h2,.md h3{font-size:16px;margin:16px 0 4px} .md p{margin:4px 0} .md ul{margin:4px 0;padding-left:20px} .md li{margin:2px 0}
.tablo{width:100%;border-collapse:collapse;font-size:13.5px} .tablo td,.tablo th{padding:6px 4px;border-bottom:1px solid var(--cizgi);text-align:left} .tablo th{font-weight:600;color:var(--ink3);font-size:12px}
/* soru akışı */
.akisust{display:flex;align-items:center;gap:12px;margin-top:4px}
.ikonbtn{width:34px;height:34px;border-radius:99px;border:1px solid var(--cizgi2);background:none;font-size:20px;line-height:1;color:var(--ink2);flex:none}
.ikonbtn:disabled{opacity:.3}
h1.soru{font-size:27px;letter-spacing:-.025em;line-height:1.15;margin:6px 0 6px}
.secenekler{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.secenek{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid var(--cizgi2);background:var(--yuzey);border-radius:16px;padding:15px 16px;font-size:16px;color:var(--ink);transition:border-color .15s,background .15s,transform .1s}
.secenek:active{transform:scale(.985)}
.secenek b{font-weight:600;display:block} .secenek small{display:block;color:var(--ink3);font-size:13px;margin-top:2px}
.secenek i{font-style:normal;color:var(--ink3);font-size:20px;width:22px;height:22px;border-radius:99px;display:grid;place-items:center;flex:none}
.secenek.on{border-color:var(--vurgu);background:rgba(var(--vurgu-rgb),.08)}
.secenek.on i{background:var(--vurgu);color:var(--vurgu-ink);font-size:13px}
.secenek.on i:empty::before{content:"✓"}
.gunsec button{min-width:52px;padding:11px 12px;font-size:15px}
.sohbet{margin-top:22px}
.balon{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin:0 0 8px auto;max-width:88%;width:max-content;background:rgba(var(--vurgu-rgb),.14);border-radius:16px 16px 4px 16px;padding:9px 12px;font-size:14.5px}
.balon button{border:0;background:none;color:var(--ink3);padding:0;font-size:12px}
.sohbetsatir{display:flex;gap:8px;align-items:center;border:1px solid var(--cizgi2);border-radius:99px;padding:4px 4px 4px 14px;background:var(--yuzey)}
.sohbetsatir input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;outline:none;min-width:0}
.sohbetsatir button{width:34px;height:34px;border-radius:99px;border:0;background:var(--yuzey3);color:var(--ink);font-size:16px;flex:none}
.ozetsatir{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--cizgi);background:none;padding:11px 0;font-size:14.5px}
.ozetsatir:last-child{border:0} .ozetsatir b{font-weight:600;text-align:right;color:var(--ink)}
.sohbetakis{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto;padding:6px 0}
.sohbetakis .balon{margin:0 0 0 auto}
.ptbalon{align-self:flex-start;max-width:92%;background:var(--yuzey2);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:14.5px}
.eylemkart{margin-top:10px;border:1px solid rgba(var(--vurgu-rgb),.45);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.adimlar{margin:4px 0 6px;padding-left:20px;color:var(--ink2);font-size:14px} .adimlar li{margin:3px 0}
.kopyasatir{display:flex;gap:8px;align-items:center} .kopyasatir code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--yuzey2);border-radius:8px;padding:7px 9px}
select.alan{appearance:auto}
.perde{z-index:90}
.pozizgara{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.poz{text-align:left;border:1px solid var(--cizgi2);background:var(--yuzey);border-radius:14px;padding:12px;color:var(--ink)}
.poz b{display:block;font-size:15px} .poz small{color:var(--ink3);font-size:12px}
.beceri{padding:2px 0} hr.ayrac{border:0;border-top:1px solid var(--cizgi);margin:16px 0}
.fotolar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.foto{border:0;padding:0;background:none;text-align:left} .foto img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block} .foto small{color:var(--ink3);font-size:11.5px}
.cipler.kaydir{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.cipler.kaydir::-webkit-scrollbar{display:none}
.cipler.kaydir button{flex:none}
/* ===================== 2026-10-27: seri (Duolingo), hareket kitaplığı (Lyfta), hızlı antrenman ve önizleme (Nike Training Club) ===================== */
:root{--alev:#ff9f43;--alev2:#ffcc33;--buz:#7fc8ff}
.alev{width:22px;height:22px;flex:none}
.alev path{fill:url(#alevGrad)}
.alev.sonuk path{fill:var(--ink3);opacity:.5}
/* Bugün başındaki seri şeridi */
.seri{display:block;width:100%;text-align:left;border:1px solid var(--cizgi);background:var(--yuzey);border-radius:var(--r);padding:14px 14px 12px;margin:0 0 12px;color:var(--ink)}
.seri.risk{border-color:rgba(255,159,67,.55);box-shadow:0 0 0 1px rgba(255,159,67,.15),0 20px 50px -30px rgba(255,159,67,.7)}
.seri-ust{display:flex;align-items:center;gap:10px}
.seri-sayi{font:800 30px/1 Geist,system-ui;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.seri-ad{font-size:13px;color:var(--ink2);line-height:1.25}
.seri-ad b{display:block;color:var(--ink);font-size:14.5px}
.seri-sag{margin-left:auto;display:flex;gap:4px;align-items:center}
.buz{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;border:1px dashed var(--cizgi2);color:var(--ink3)}
.buz.dolu{border:1px solid rgba(127,200,255,.55);background:rgba(127,200,255,.12);color:var(--buz)}
.buz svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.hafta7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.hafta7 div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink3);font-weight:600}
.hafta7 i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--yuzey3);font-style:normal;font-size:13px;color:var(--ink3)}
.hafta7 .tamam i{background:linear-gradient(160deg,var(--alev2),var(--alev));border-color:transparent;color:#2a1400}
.hafta7 .onarildi i{border-color:var(--alev);color:var(--alev)}
.hafta7 .korundu i{background:rgba(127,200,255,.16);border-color:rgba(127,200,255,.6);color:var(--buz)}
.hafta7 .kacti i{border-style:dashed;opacity:.6}
.hafta7 .bekliyor i{border-color:var(--alev);animation:nabizAlev 1.8s ease-in-out infinite}
.hafta7 .gelecek i,.hafta7 .once i{opacity:.45}
.hafta7 .bugun{color:var(--ink)}
@keyframes nabizAlev{0%,100%{box-shadow:0 0 0 0 rgba(255,159,67,.45)}50%{box-shadow:0 0 0 6px rgba(255,159,67,0)}}
.seri-alt{margin-top:10px;font-size:13.5px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.seri-alt.ok{color:var(--yesil)}
/* hafta noktaları içindeki küçük işaretler */
.hafta7 svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* telafi kartı */
.telafi{border:1px solid rgba(255,159,67,.5);background:linear-gradient(180deg,rgba(255,159,67,.10),transparent 70%),var(--yuzey)}
/* kutlama: tam ekran */
.kutla{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px 22px calc(30px + var(--alt));
  background:radial-gradient(ellipse 70% 50% at 50% 38%,rgba(255,159,67,.22),transparent 70%),color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:center;animation:kutlaGir .35s ease}
@keyframes kutlaGir{from{opacity:0}to{opacity:1}}
.kutla .alev.buyukalev{width:120px;height:120px;filter:drop-shadow(0 12px 40px rgba(255,159,67,.55));animation:alevZipla 1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes alevZipla{0%{transform:scale(.2) translateY(30px);opacity:0}100%{transform:scale(1);opacity:1}}
.kutla .sayi{font:800 76px/1 Geist,system-ui;letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,var(--alev2),var(--alev));-webkit-background-clip:text;background-clip:text;color:transparent}
.kutla h2{margin:0;font-size:24px;letter-spacing:-.02em}
.kutla p{margin:0;color:var(--ink2);max-width:340px}
.kutla .hafta7{width:min(340px,100%);margin:10px 0 4px}
.kutla .olay{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--cizgi);background:var(--yuzey);border-radius:14px;padding:10px 12px;width:min(360px,100%);animation:kutlaGir .5s ease both}
.kutla .olay b{display:block}
.kutla .olay small{color:var(--ink2)}
.kutla .btn{margin-top:12px;min-width:200px}
.konfeti{position:fixed;inset:0;pointer-events:none;z-index:121;overflow:hidden}
.konfeti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:dus linear forwards}
@keyframes dus{to{transform:translateY(110vh) rotate(720deg)}}
/* rozetler */
.rozsira .roz{flex:none;width:84px}
.rozetler{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px 10px}
.roz{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;color:var(--ink2);padding:0}
.roz .daire{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--yuzey2);border:1px solid var(--cizgi)}
.roz .daire svg.ik{width:28px;height:28px;stroke:var(--ink3);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.roz .daire svg.halka{position:absolute;inset:-4px;width:70px;height:70px;transform:rotate(-90deg)}
.roz.var .daire{background:radial-gradient(circle at 35% 30%,rgba(var(--vurgu-rgb),.35),rgba(var(--vurgu-rgb),.08) 70%);border-color:rgba(var(--vurgu-rgb),.6);box-shadow:0 10px 30px -14px rgba(var(--vurgu-rgb),.8)}
.roz.var .daire svg.ik{stroke:var(--vurgu)}
.roz.var.alevli .daire{background:radial-gradient(circle at 35% 30%,rgba(255,159,67,.45),rgba(255,159,67,.1) 70%);border-color:rgba(255,159,67,.6);box-shadow:0 10px 30px -14px rgba(255,159,67,.9)}
.roz.var.alevli .daire svg.ik{stroke:var(--alev)}
.roz .sv{position:absolute;right:-4px;bottom:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--yuzey);border:1px solid var(--cizgi);font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--ink2);font-variant-numeric:tabular-nums}
.roz.var .sv{background:var(--vurgu);border-color:var(--vurgu);color:#142004}
.roz .pip{display:flex;gap:3px;justify-content:center}.roz .pip i{width:5px;height:5px;border-radius:50%;background:var(--cizgi)}.roz .pip i.on{background:var(--vurgu)}
.svliste .lsatir .roz{flex:none}.svliste .lsatir.yok{opacity:.55}
.gorev{display:flex;gap:14px;align-items:center}
.gorev ul{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.gorev li{display:flex;align-items:center;gap:10px;font-size:14px;min-width:0}
.gorev li .gi{flex:none;width:30px;height:30px;border-radius:9px;background:var(--yuzey2);display:grid;place-items:center}

function kuyruk(){ try{ return JSON.parse(store.get('pt_kuyruk', '[]')); }catch(e){ return []; } }
async function gonder(yol, govde){
  try{ return await api(yol, json(govde)); }
  catch(e){ if (e instanceof TypeError || /fetch|network|load/i.test(e.message)){ const q = kuyruk(); q.push({yol, govde, t: Date.now()}); store.set('pt_kuyruk', JSON.stringify(q)); toast('Bağlantı yok; kayıt telefonda bekliyor, bağlanınca gönderilecek.'); return {kuyrukta: true}; } throw e; }
}
let kuyrukCalisiyor = false;
async function kuyruguBosalt(){ if (kuyrukCalisiyor) return; const q = kuyruk(); if (!q.length) return; kuyrukCalisiyor = true;
  const kalan = []; let reddedilen = 0;
  try{ for (const x of q){ try{ await api(x.yol, json(x.govde)); }catch(e){ if (e.durum >= 400 && e.durum < 500) reddedilen++; else kalan.push(x); } } }
  finally{ const sonra = kuyruk().slice(q.length); store.set('pt_kuyruk', JSON.stringify(kalan.concat(sonra))); kuyrukCalisiyor = false; }
  const giden = q.length - kalan.length - reddedilen;
  if (giden) toast(`${giden} bekleyen kayıt gönderildi.`);
  if (reddedilen) toast(`${reddedilen} bekleyen kayıt kabul edilmedi ve silindi.`); }
addEventListener('online', kuyruguBosalt);

/* sabit: içinde girilmiş veri olan sayfalar (seans sonu, yemek, kurulum) boşluğa dokununca kapanmaz; yalnız düğmeyle. */
function sayfa(html, {kapaninca, sabit} = {}){
  const p = document.createElement('div'); p.className = 'perde';
  p.innerHTML = `<div class="sayfa" role="dialog" aria-modal="true"><div class="tutac"></div>${sabit ? '<button class="kapatx" data-kapat aria-label="Kapat">×</button>' : ''}${html}</div>`;
  document.body.appendChild(p);
  let kapandi = false;
  const kapat = () => { if (kapandi) return; kapandi = true; p.remove(); const f = kapaninca || p.kapaninca; f && f(); };
  p.addEventListener('click', e => { if ((e.target === p && !sabit) || e.target.closest('[data-kapat]')) kapat(); });
  p.kapat = kapat;
  return p;
}

    yukle(true);

/* ------------------------------------------------------------------ günün akışı: koç gününüzü saat saat düzenler */
const AKIS_IKON = {sabah: '☀︎', seans: '●', ogun: '◐', su: '◇', mola: '↻', aksam: '☾', uyku: '☾', takvim: '▢', pencere: '◐'};
async function akisYukle(){
  const k = $('#akis'); if (!k) return;
  try{ S.akis = await api('/api/pt/akis?tarih=' + bugunT()); }catch(e){ k.remove(); return; }
  akisCiz();
}
function akisCiz(){
  const k = $('#akis'); if (!k || !S.akis) return;
  const L = S.akis.akis || [];
  const acik = store.get('pt_akis_acik', '0') === '1';
  let simdi = L.findIndex(x => x.durum === 'simdi'); if (simdi < 0) simdi = L.findIndex(x => x.durum === 'sirada'); if (simdi < 0) simdi = L.length - 1;
  const gos = acik ? L : L.filter((x, i) => i >= Math.max(0, simdi - 1) && i < Math.max(0, simdi - 1) + 4);
  k.innerHTML = `<div class="kbas"><h3>Günün akışı</h3><button class="metin sessiz" id="akisAc" style="font-size:13px">${acik ? 'Kısalt' : 'Tamamı'}</button></div>
    <div class="akis">${gos.map(x => `<button class="akisoge ${x.bitti ? 'bitti' : ''} ${x.durum || ''}" data-eylem="${esc(x.eylem || '')}"><span class="as">${esc(x.saat)}</span><span class="ai">${x.bitti ? '✓' : AKIS_IKON[x.tur] || '·'}</span><span class="am"><b>${esc(x.baslik)}</b>${x.detay ? `<small>${esc(x.detay)}</small>` : ''}</span></button>`).join('')}</div>`;
  $('#akisAc', k).onclick = () => { store.set('pt_akis_acik', acik ? '0' : '1'); akisCiz(); };
  $$('[data-eylem]', k).forEach(b => b.onclick = () => akisEylem(b.dataset.eylem));
}
function akisEylem(e){
  if (!e) return;
  const [t, x] = e.split(':');
  if (t === 'sabah') return sabahSayfa();
  if (t === 'seans'){ const s = (S.o.bugun.seanslar || []).find(s => String(s.id) === x); return s && (s.bolumler || []).length ? oynat(s) : null; }
  if (t === 'ogun' || t === 'yemek'){ S.sek = 'beslenme'; store.set('pt_sek', 'beslenme'); window.scrollTo(0, 0); return ciz(); }
  if (t === 'su') return gonder('/api/pt/su', {tarih: bugunT(), ml: 500}).then(() => { toast('500 ml eklendi.'); S.akis = null; yukle(); });
  if (t === 'mola') return oynat({tur: 'mobilite', baslik: 'Hareket molası', sure_dk: 2, bolumler: [{ad: 'Mola', bicim: 'sure', hareketler: ['kedi_inek', 'gogus_donus', 'derin_squat_tutus'].map(k => ({kod: k, sure_sn: 40}))}]}, {asgari: true});
  if (t === 'aksam') return aksamGorusmesi();
}

/* ------------------------------------------------------------------ KOÇ: görüşmeler, mesajlar, konuşma, Health'in hafızası */
/* "2026-W43" gibi ISO hafta kimliğini insanca yazar: "20–26 Ekim". */
function haftaYazi(w){ const m = /^(\d{4})-W(\d{1,2})$/.exec(w || ''); if (!m) return w || '';
  const y = +m[1], n = +m[2], j4 = new Date(Date.UTC(y, 0, 4)), pz = new Date(j4); pz.setUTCDate(j4.getUTCDate() - ((j4.getUTCDay() + 6) % 7) + (n - 1) * 7);
  const pa = new Date(pz); pa.setUTCDate(pz.getUTCDate() + 6); const ay = d => d.toLocaleDateString('tr-TR', {month: 'long', timeZone: 'UTC'});
  return ay(pz) === ay(pa) ? `${pz.getUTCDate()}–${pa.getUTCDate()} ${ay(pa)}` : `${pz.getUTCDate()} ${ay(pz)} – ${pa.getUTCDate()} ${ay(pa)}`; }
function kocCiz(){
  const o = S.o, p = o.profil, m = $('#main');
  const ba = p.beslenme_aliskanlik || {}, gd = p.gun_duzeni || {};
  const G = [
    ['diyet', 'Diyetisyen görüşmesi', ba.tarih ? `Son: ${tarihKisa(ba.tarih)} · menü buna göre` : 'Ne yediğinizi ve sizi neyin zorladığını sorarım.', ba.tarih ? 'Yeniden' : 'Başla'],
    ['gun', 'Gün düzeniniz', gd.kalkis ? `${gd.kalkis} kalkış · ${gd.yatis} yatış${gd.is_bas ? ` · iş ${gd.is_bas}-${gd.is_bit}` : ''}` : 'Kalkış, iş ve yatış saatleriniz.', gd.kalkis ? 'Değiştir' : 'Başla'],
    ['hafta', 'Haftalık görüşme', o.haftalik_gorusme ? 'Bu haftanın görüşmesi sizi bekliyor.' : 'Haftayı değerlendirip gelecek haftayı birlikte kurarız.', 'Başla'],
    ['aksam', 'Akşam görüşmesi', (o.bugun.aksam || {}).koc ? 'Bugün yapıldı.' : 'Bugün nasıl geçti, yarın ne var.', (o.bugun.aksam || {}).koc ? 'Yeniden' : 'Başla']];
  const ek = p.ek_bilgi || [], notlar = (p.notlar || []).filter(n => n && (n.metin || typeof n === 'string'));
  const sv = (k, v) => Array.isArray(v) ? v.join(', ') : v;
  const BA = {ilk_ogun: 'İlk öğün', ogle: 'Öğle', aksam: 'Akşam', atistirma: 'Atıştırma', atistirma_ne: 'Atıştırdıkları', icecek: 'İçecekler', alkol: 'Alkol', pisirme: 'Yemek yapma', pisirme_sure: 'Öğüne ayrılan vakit', toplu: 'Toplu hazırlık', disari: 'Dışarıda yeme', protein: 'Sevdiği proteinler', sevmez: 'Sevmedikleri', butce: 'Bütçe', zor: 'En zorlayan'};
  let h = `<button class="metin sessiz" data-kocgeri style="padding:0">‹ Siz</button><h1 class="bas">Koçunuz.</h1><p class="alti">Antrenörünüz ve diyetisyeniniz. Sizi tanıdıkça planı daha iyi kurarım.</p>`;
  const dg = o.degerlendirme || {}, kn = o.kontrol || {}, hd = o.hedefler || {};
  h += `<div class="kart"><div class="kbas"><h3>Health'in değerlendirmesi</h3>${dg.var ? `<span class="mono">${dg.eski ? 'profiliniz değişti' : 'güncel'}</span>` : ''}</div>
    ${dg.var ? `<p class="gri2" style="margin:0 0 8px;font-size:14px">${esc(dg.mesaj || '')}</p><div class="hsatir"><span>Antrenman</span><span>${esc(dg.antrenman || '')}</span></div><div class="hsatir"><span>Beslenme</span><span>${esc(dg.beslenme || '')}</span></div><div class="satir" style="margin-top:8px"><button class="btn kucuk" data-deger>Oku</button><button class="metin sessiz" data-deger-yenile style="font-size:13px">Yeniden yaz</button></div>`
      : dg.hazirlaniyor ? '<div class="satir gri"><span class="donen"></span> Yazılıyor</div>' : '<p class="gri2" style="margin:0 0 8px;font-size:14px">Sizi nasıl gördüğüm, antrenman ve beslenme yaklaşımınız.</p><button class="btn kucuk" data-deger-yenile>Şimdi yaz</button>'}</div>`;
  h += `<div class="kart"><div class="kbas"><h3>Hedefler</h3><span class="mono">4 hafta · 3 ay · 1 yıl</span></div>${(hd.aktif || []).map(x => hedefSatir(x)).join('') || '<p class="gri2" style="margin:0 0 8px;font-size:14px">Henüz belirlenmedi.</p>'}<button class="btn kucuk" style="margin-top:8px" data-hedef>${hd.var ? 'Düzenle' : 'Birlikte belirleyelim'}</button></div>`;
  h += `<div class="kart"><div class="kbas"><h3>Ara kontroller</h3><span class="mono">her 14 gün</span></div>
    ${kn.zamani ? (kn.acik ? '<p class="gri2" style="margin:0 0 8px;font-size:14px">Kontrol zamanı geldi; üç dakika.</p><button class="btn ana kucuk" data-kontrol-basla>Başla</button>' : '<div class="satir gri"><span class="donen"></span> Hazırlanıyor</div>')
      : `<p class="gri2" style="margin:0 0 8px;font-size:14px">Sıradaki: ${tarihKisa(kn.sonraki)}${kn.kalan ? ` · ${kn.kalan} gün` : ''}. Uyum, zorluk, ağrı ve kilo trendine bakıp programın aynı kalıp kalmayacağına karar veririm.</p>`}
    ${kn.son ? `<div class="lsatir"><div class="lgovde"><b>${tarihKisa(kn.son.tarih)}: ${(kn.son.sonuc || {}).karar === 'guncelle' ? 'güncellendi' : 'devam'}</b><small>${esc((kn.son.sonuc || {}).ozet || '')}</small></div></div>` : ''}
    <button class="metin sessiz" data-kontrol-gecmis style="font-size:13px">Geçmiş kararlar</button></div>`;
  h += `<div class="kart"><div class="kbas"><h3>Görüşmeler</h3></div>${G.map(([k, a, alt, d]) => `<div class="lsatir"><div class="lgovde"><b>${a}</b><small>${esc(alt)}</small></div><button class="btn kucuk ${k === 'hafta' && o.haftalik_gorusme ? 'ana' : ''}" data-kg="${k}">${d}</button></div>`).join('')}</div>`;
  if (o.mesaj && o.mesaj.hafta) h += `<div class="kart"><div class="kbas"><h3>Haftalık mesajınız</h3><span class="mono">${esc(haftaYazi(o.mesaj.hafta))}</span></div><p class="gri2" style="margin:0 0 6px;font-size:14px">${esc(o.mesaj.degisecek || '')}</p><button class="metin" data-mesaj>Oku ya da dinle</button></div>`;
  h += '<div class="kart" id="ihtiyacKart"><div class="satir gri"><span class="donen"></span></div></div>';
  h += `<div class="kart hafiza"><div class="kbas"><h3>Health'in bildikleri</h3></div><p class="gri2" style="margin:0 0 8px;font-size:13.5px">Plan yazarken bunları bilirim. Yanlış ya da eskimiş olanı silin.</p>
    ${Object.keys(BA).filter(k => ba[k] && !(Array.isArray(ba[k]) && !ba[k].length)).map(k => `<div class="hsatir"><span>${BA[k]}</span><span>${esc(sv(k, ba[k]))}</span></div>`).join('')}
    ${(p.saglik_degerleri || []).map(x => `<div class="hsatir"><span>${esc(x.ad)}</span><span>${esc(x.deger)} ${esc(x.birim || '')}</span></div>`).join('')}
    ${(p.sinirlar || []).map(x => `<div class="hsatir"><span>Sağlık notu</span><span>${esc(x)}</span></div>`).join('')}
    ${ek.map((x, i) => `<div class="lsatir"><div class="lgovde"><small>${esc(x.soru)}</small><b style="font-weight:500">${esc(x.cevap)}</b></div><button class="sil" data-eksil="${i}" aria-label="Sil">✕</button></div>`).join('')}
    ${notlar.map((x, i) => `<div class="lsatir"><div class="lgovde"><b style="font-weight:500">${esc(x.metin || x)}</b></div><button class="sil" data-notsil="${i}" aria-label="Sil">✕</button></div>`).join('')}
    ${!ek.length && !notlar.length && !Object.keys(ba).length ? '<p class="gri" style="font-size:13.5px;margin:0">Henüz bir şey yok; görüşmelerle dolar.</p>' : ''}</div>`;
  m.innerHTML = h;
  ihtiyacKart(); yeniBagla(m);
  $$('[data-kocgeri]', m).forEach(x => x.onclick = () => { S.sek = 'siz'; store.set('pt_sek', 'siz'); window.scrollTo(0, 0); ciz(); });
  $$('[data-kg]', m).forEach(b => b.onclick = () => ({diyet: diyetGorusmesi, gun: gunGorusmesi, hafta: haftalikGorusme, aksam: aksamGorusmesi})[b.dataset.kg]());
  $$('[data-mesaj]', m).forEach(x => x.onclick = () => mesajSayfa(S.o.mesaj));
  $$('[data-eksil]', m).forEach(b => b.onclick = async () => { const L = ek.filter((_, i) => i !== +b.dataset.eksil); await api('/api/pt/profil', json({ek_bilgi: L})); toast('Silindi.'); yukle(); });
  $$('[data-notsil]', m).forEach(b => b.onclick = async () => { const n = notlar[+b.dataset.notsil]; await api('/api/pt/profil', json({notlar: (p.notlar || []).filter(x => x !== n)})); toast('Silindi.'); yukle(); });
}

/* ------------------------------------------------------------------ Health önerileri (2026-10-27): sıradaki program ve "şuna ihtiyacınız var". Bugün'de günde tek kart,
   tek cümlelik nedenle; Sonra (7 gün) / Bana göre değil (kalıcı). Koç'ta hepsi ve sıklık ayarı; Programlar'da "Sizin için". */
const ONERI_TUR = {ekipman: 'Ekipman', beslenme: 'Beslenme', toparlanma: 'Toparlanma', olcum: 'Ölçüm', saglik: 'Sağlık', hareketlilik: 'Hareketlilik'};
function oneriSatir(o, buyuk){
  const e = o.eylem || {};
  return `<div class="oneri" data-okod="${esc(o.kod)}"><span class="mono">${buyuk ? 'Health önerisi · ' : ''}${esc(ONERI_TUR[o.tur] || '')}</span><b>${esc(o.baslik)}</b><p>${esc(o.neden)}</p>
    <div class="satir">${e.ad ? `<button class="btn kucuk" data-oeylem="${esc(o.kod)}">${esc(e.ad)}</button>` : ''}<button class="metin sessiz" data-osonra="${esc(o.kod)}">Sonra</button><button class="metin sessiz" data-odegil="${esc(o.kod)}">Bana göre değil</button></div></div>`;
}
function oneriKart(){
  const o = S.o.oneri; if (!o) return '';
  if (o.tip === 'program'){ const P = o.program;
    return `<div class="kart"><div class="oneri" data-okod="${esc(o.kod)}"><span class="mono">Health önerisi · Program</span><b>${esc(P.ad)} · ${P.hafta} hafta</b><p>${esc(P.neden)}${P.eksik_ekipman.length ? ` ${esc(P.eksik_ekipman.join(', '))} yoksa yerine benzer hareketler konur.` : ''}</p>
      <div class="satir"><button class="btn kucuk" data-oprog="${esc(P.kod)}">Programa bak</button><button class="metin sessiz" data-osonra="${esc(o.kod)}">Sonra</button><button class="metin sessiz" data-odegil="${esc(o.kod)}">Bana göre değil</button></div>
      ${(o.alternatif || []).length ? `<p class="gri" style="font-size:12.5px;margin:8px 0 0">Ya da: ${o.alternatif.map(a => `<button class="metin" data-oprog="${esc(a.kod)}">${esc(a.ad)}</button>`).join(' · ')}</p>` : ''}</div></div>`; }
  return `<div class="kart">${oneriSatir(o, true)}</div>`;
}
async function oneriEylem(o){
  const e = o.eylem || {};
  try{
    if (e.tur === 'ekipman'){ await api('/api/pt/ekipman', json({kod: e.kod})); toast('Eklendi. Gelecek planlarda bu ekipmanı kullanırım.'); return yukle(); }
    if (e.tur === 'test') return testSayfa();
    if (e.tur === 'plan') return planYaz(e.istek || '');
    if (e.tur === 'sohbet') return sohbetSayfa(o.baslik);
    if (e.tur === 'diyetisyen') return diyetGorusmesi();

/* Sesle söylemek: önce bu bilgisayardaki ses modeli (ses dışarı gitmez); yoksa tarayıcının ses tanıması. */
let SES_YEREL = true;
function mikBagla(btn, gir, yolla){
  let rec = null, tanima = null;
  const tarayici = () => {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R){ toast('Bu tarayıcı sesi yazıya dökemiyor; yazarak söyleyin.'); return; }
    tanima = new R(); tanima.lang = 'tr-TR'; tanima.interimResults = true; let son = '';
    tanima.onresult = e => { son = [...e.results].map(r => r[0].transcript).join(''); gir.value = son; };
    tanima.onend = () => { tanima = null; btn.classList.remove('kayit'); if (son.trim()) yolla(); };
    tanima.onerror = () => { btn.classList.remove('kayit'); };
    tanima.start(); btn.classList.add('kayit');
  };
  btn.onclick = async () => {
    if (tanima){ tanima.stop(); return; }
    if (rec){ if (rec.state === 'recording') rec.stop(); return; }
    if (!SES_YEREL || !navigator.mediaDevices || !window.MediaRecorder) return tarayici();
    let akis; try{ akis = await navigator.mediaDevices.getUserMedia({audio: true}); }catch(e){ toast('Mikrofona izin verilmedi.'); return; }
    const parca = []; rec = new MediaRecorder(akis); rec.ondataavailable = e => { if (e.data.size) parca.push(e.data); };
    rec.onstop = async () => {
      akis.getTracks().forEach(t => t.stop()); const tip = rec.mimeType || 'audio/webm'; rec = null;
      btn.classList.remove('kayit'); btn.classList.add('bekle');
      const f = new FormData(); f.append('dosya', new Blob(parca, {type: tip}), tip.includes('mp4') ? 'ses.m4a' : 'ses.webm');
      try{ const r = await fetch('/api/pt/ses-yazi', {method: 'POST', body: f}); const j = await r.json().catch(() => ({}));
        btn.classList.remove('bekle');
        if (r.status === 501){ SES_YEREL = false; toast('Bir daha dokunun; tarayıcının ses tanımasını kullanacağım.'); return; }
        if (!r.ok) throw new Error(j.hata || 'Sesi anlayamadım.');
        gir.value = (gir.value ? gir.value + ' ' : '') + j.metin; yolla();
      }catch(e){ btn.classList.remove('bekle'); toast(e.message); }
    };
    rec.start(); btn.classList.add('kayit'); toast('Dinliyorum; bitince yeniden dokunun.');
    setTimeout(() => { if (rec && rec.state === 'recording') rec.stop(); }, 90000);
  };
}
function kiloMini(){

  return `<div class="skart" style="display:block"><b>Kilo eğrisi</b><small>${v[0].toFixed(1).replace('.', ',')} → ${v[v.length - 1].toFixed(1).replace('.', ',')} kg · son ${T.length} kayıt</small>
    <svg viewBox="0 -2 220 52" style="width:100%;height:56px;margin-top:6px"><polyline points="${pt}" fill="none" style="stroke:var(--vurgu)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
}

const FOTO = {

  async hepsi(){ const db = await this.ac(); return new Promise(c => { const q = db.transaction('f').objectStore('f').getAll(); q.onsuccess = () => c((q.result || []).sort((a, b) => a.id < b.id ? 1 : -1)); q.onerror = () => c([]); }); },
  async ekle(x){ const db = await this.ac(); return new Promise(c => { const tx = db.transaction('f', 'readwrite'); tx.objectStore('f').put(x); tx.oncomplete = c; }); },
  async sil(id){ const db = await this.ac(); return new Promise(c => { const tx = db.transaction('f', 'readwrite'); tx.objectStore('f').delete(id); tx.oncomplete = c; }); },

function adimlar(seans){
  const A = [];
  for (const b of seans.bolumler || []){
    const bic = b.bicim || 'set', hs = b.hareketler || [];
    if (['tur', 'tabata', 'emom'].includes(bic)){
      const n = b.tur_sayisi || 3, cs = b.calisma_sn || (bic === 'tabata' ? 20 : 40), ds = b.dinlenme_sn ?? (bic === 'tabata' ? 10 : 20);
      for (let r = 1; r <= n; r++) hs.forEach((h, i) => { A.push({tip: 'calis', olcu: 'sure', sn: h.sure_sn || cs, h, bolum: b.ad, etiket: `Tur ${r}/${n}`, set: r, setler: n});
        if (!(r === n && i === hs.length - 1) && ds) A.push({tip: 'dinlen', sn: ds, bolum: b.ad}); });
    } else if (bic === 'sure' || bic === 'akis'){
      hs.forEach((h, i) => { A.push(!h.sure_sn && h.tekrar ? {tip: 'calis', olcu: 'tekrar', sn: 0, hedef: String(h.tekrar), h, bolum: b.ad, etiket: `${i + 1}/${hs.length}`, set: 1, setler: 1, sonSet: true}
          : {tip: 'calis', olcu: 'sure', sn: h.sure_sn || 45, h, bolum: b.ad, etiket: `${i + 1}/${hs.length}`, set: 1, setler: 1});
        if (i < hs.length - 1) A.push({tip: 'dinlen', sn: 8, bolum: b.ad, gecis: true}); });
    } else {
      hs.forEach((h, i) => { const k = kat(h.kod), n = h.set || 3, sureli = !!h.sure_sn || k.olcu === 'sure';
        const hd = (k.hedef || {}), aralik = String(h.tekrar || `${hd.alt || 6}-${hd.ust || 10}`);
        for (let s = 1; s <= n; s++){ A.push({tip: 'calis', olcu: sureli ? 'sure' : 'tekrar', sn: h.sure_sn || (sureli ? (+aralik.split('-').pop() || 30) : 0), hedef: aralik, h, bolum: b.ad, etiket: `Set ${s}/${n}`, set: s, setler: n, sonSet: s === n});
          const son = s === n && i === hs.length - 1; if (!son) A.push({tip: 'dinlen', sn: s === n ? Math.min(90, h.dinlenme_sn || 60) : (h.dinlenme_sn || 90), bolum: b.ad}); } });
    }
    if (A.length && A[A.length - 1].tip !== 'dinlen' && b !== seans.bolumler[seans.bolumler.length - 1]) A.push({tip: 'dinlen', sn: 20, bolum: b.ad, gecis: true});
  }
  A.forEach((a, i) => { a.sonraki = A.slice(i + 1).find(x => x.tip === 'calis'); });
  return A;
}

/* ------------------------------------------------------------------ testler */
/* Başlangıç testleri (2026-10-28): tek ekranda dokuz kutu yerine test test; her sonuç girildiği an kaydedilir (aynı gün birleşir),
   istenen yerde bırakılır. Önce mat yeter dört temel test (5 dk), sonra diğerleri. Süreli testlerde başlat/bıraktım sayacı, tekrarlarda +/− sayaç. */
function testSayfa(sec){
  sec = sec && sec.sec ? sec : null;
  const var_ = S.o.profil.ekipman || [], SIRA = ['squat_max', 'sinav_max', 'plank_sn', 'hollow_sn', 'derin_squat', 'omuz_duvar', 'tek_ayak_sn', 'oturkalk', 'barfiks_max', 'asilma_sn', 'dips_max', 'bel_cm', 'dinlenme_nabzi'];
  const T = S.kat.testler.filter(([k]) => !(k === 'barfiks_max' || k === 'asilma_sn') || var_.includes('bar')).filter(([k]) => k !== 'dips_max' || var_.includes('paralel'))
    .filter(([k]) => !sec || sec.sec.includes(k)).sort((a, b) => SIRA.indexOf(a[0]) - SIRA.indexOf(b[0]));
  const p = sayfa('<div id="ts"></div>'), kutu = $('#ts', p);
  let i = 0, kayitli = 0, zam = null;
  const dur = () => { if (zam) clearInterval(zam); zam = null; };
  const bitir = async () => { dur();
    if (!kayitli) return p.kapat();
    if (sec){                                                                   // ilk hafta adımı
      try{ await gonder('/api/pt/seans', {tarih: bugunT(), seans: {id: 'ilk' + sec.ilk, tur: 'test', baslik: 'Tanışma testi', sure_dk: Math.max(3, kayitli * 2), zorluk: 5, ilk_adim: sec.ilk}}); }catch(e){}
      p.kapat(); toast('Kaydedildi. Basamaklarınızı bu sonuçlara göre seçtim.'); return yukle();
    }
    const pl = (S.o.bugun.seanslar || []).find(x => x.tur === 'test');
    if (pl) try{ await gonder('/api/pt/seans', {tarih: bugunT(), seans: {plan_id: pl.id, tur: 'test', baslik: 'Başlangıç testleri', sure_dk: Math.max(5, kayitli * 2), zorluk: 6}}); }catch(e){}
    p.kapat();
    const q = sayfa(`<h3>Kaydedildi.</h3><p class="gri2">${kayitli} testin sonucuna göre basamaklarınızı seçtim.${i < T.length ? ' Kalan testleri başka bir gün yapabilirsiniz; Bugün ekranında görünür.' : ''} Haftanın kalanını bu sonuçlarla yeniden yazayım mı?</p><div class="salt"><button class="btn" data-kapat>Şimdi değil</button><button class="btn ana" id="t_yaz">Yeniden yaz</button></div>`);
    q.querySelector('#t_yaz').onclick = function(){ q.kapat(); planYaz('Başlangıç testleri yapıldı; testi plandan çıkar ve günleri test sonuçlarındaki basamaklarla yaz.', new Date().getDay() % 6 === 0 || new Date().getDay() === 5 ? S.o.hafta.sonraki : null); };
    yukle(); };
  const ciz = () => { dur();
    if (i >= T.length) return bitir();
    const [k, ad, olcu, hk, ac] = T[i];
    const [acik, secL] = olcu === 'secim' && ac.includes(' || ') ? ac.split(' || ') : ['', ac];
    const giris = olcu === 'secim' ? `${acik ? `<p class="gri2" style="margin:0 0 12px;font-size:14px">${esc(acik)}</p>` : ''}<div class="seg" id="t_seg">${secL.split(' | ').map(x => `<button data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`
      : olcu === 'tekrar' ? `<div class="tsayac"><button class="btn" data-d="-1" aria-label="Bir az">−</button><input class="alan" id="t_v" inputmode="numeric" value="0"><button class="btn" data-d="1" aria-label="Bir fazla">+</button></div>`
      : olcu === 'sure' ? `<div class="tsure"><b id="t_sn">0</b><span class="gri">sn</span></div><div class="salt" style="justify-content:center"><button class="btn" id="t_bas">Başlat</button></div><input class="alan kisa" id="t_v" inputmode="numeric" placeholder="ya da saniyeyi yazın" style="margin-top:8px">`
      : `<input class="alan" id="t_v" inputmode="decimal" placeholder="${k === 'bel_cm' ? 'cm' : 'atım/dk'}">`;
    kutu.innerHTML = `<span class="etk">Test ${i + 1}/${T.length}${i === 0 ? ' · her biri 1-2 dakika' : ''}</span><h3 style="margin:4px 0 6px">${esc(ad)}</h3>
      ${hk ? `<button class="metin" data-hk="${esc(hk)}" style="padding:0;margin-bottom:6px">Nasıl yapılır?</button>` : ''}
      ${olcu !== 'secim' ? `<p class="gri2" style="margin:0 0 12px;font-size:14px">${esc(ac)}</p>` : ''}${giris}
      <div class="salt"><button class="btn" id="t_gec">Geç</button><button class="btn ana" id="t_ok">${i === T.length - 1 ? 'Kaydet ve bitir' : 'Kaydet, sonraki'}</button></div>
      <p style="text-align:center;margin:10px 0 0"><button class="metin" id="t_birak">${kayitli ? 'Bugünlük bu kadar' : 'Vazgeç'}</button></p>`;
    segBagla(kutu);
    const v = $('#t_v', kutu);
    $$('[data-d]', kutu).forEach(b => b.onclick = () => { v.value = Math.max(0, (+v.value || 0) + +b.dataset.d); });
    const bas = $('#t_bas', kutu);
    if (bas) bas.onclick = () => { if (zam){ dur(); bas.textContent = 'Yeniden başlat'; v.value = $('#t_sn', kutu).textContent; return; }
      const t0 = Date.now(); bas.textContent = 'Bıraktım'; bas.classList.add('ana'); bip?.(); zam = setInterval(() => { $('#t_sn', kutu).textContent = Math.floor((Date.now() - t0) / 1000); }, 250); };
    $('#t_gec', kutu).onclick = () => { i++; ciz(); };
    $('#t_birak', kutu).onclick = bitir;
    $('#t_ok', kutu).onclick = async () => {
      if (zam && bas) bas.click();
      let deger = olcu === 'secim' ? segDeger($('#t_seg', kutu)) : String(v.value || '').replace(',', '.').trim();
      if (!deger && deger !== 0) return toast(olcu === 'secim' ? 'Bir seçenek seçin ya da geçin.' : 'Bir sonuç girin ya da geçin.');
      if (olcu !== 'secim') { deger = +deger; if (!isFinite(deger) || deger < 0 || deger > 1000) return toast('Sonuç geçerli bir sayı olmalı.'); }
      const b = $('#t_ok', kutu); b.disabled = true;
      try{ await gonder('/api/pt/test', {sonuclar: {[k]: deger}}); kayitli++; i++; ciz(); }catch(e){ b.disabled = false; toast(e.message); } };
  };
  const eski = p.kapat; p.kapat = () => { dur(); eski.call(p); };
  ciz();
}

let harita = null;
function rotaSayfa(dk = 60, yog = 'kolay'){
  const p = sayfa(`<h3>Bisiklet rotası</h3><p class="gri2" style="margin:0;font-size:14px">Bulunduğunuz yerden çıkıp aynı yere dönen döngü.</p>
    <div class="satir" style="margin-top:10px"><span class="gri2">Süre</span>${sayacHtml('sure', dk, 20, 240, 10)}<span class="gri">dk</span></div>
    <span class="etk">Tempo</span><div class="seg" id="r_yog">${[['kolay', 'Kolay'], ['orta', 'Orta'], ['aralik', 'Aralıklı']].map(([v, a]) => `<button data-v="${v}" class="${yog === v ? 'on' : ''}">${a}</button>`).join('')}</div>
    <div class="salt"><button class="btn ana" id="r_bul">Rota bul</button></div><div id="r_sonuc"></div>`);
  segBagla(p); sayacBagla(p);
  $('#r_bul', p).onclick = async () => {
    const b = $('#r_bul', p); b.disabled = true; b.innerHTML = '<span class="donen"></span> Konum ve rüzgâr';
    const konum = await new Promise(c => { if (!navigator.geolocation || !isSecureContext) return c(null); navigator.geolocation.getCurrentPosition(x => c({lat: x.coords.latitude, lon: x.coords.longitude}), () => c(null), {timeout: 8000, maximumAge: 300000}); });
    try{ const r = await api('/api/pt/rota', json({...(konum || {}), sure_dk: +$('[data-ad="sure"] b', p).textContent, yogunluk: segDeger($('#r_yog', p))}));
      b.disabled = false; b.textContent = 'Yeniden bul'; rotaCiz(p, r, !konum); }

  };
}
const ROTA_RENK = ['#C4F23A', '#6e8cff', '#ff9f43'];
/* Harita kitaplığı yalnız rota sayfasında yüklenir (eskiden her açılışta iki engelleyici istek; çevrimdışı parkta açılışı geciktiriyordu). */
function haritaYukle(){
  if (window.L && window.L.map) return Promise.resolve(true);
  return new Promise(c => { const k = document.createElement('link'); k.rel = 'stylesheet'; k.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(k);
    const j = document.createElement('script'); j.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; j.onload = () => c(true); j.onerror = () => c(false); document.head.appendChild(j); });
}
async function rotaCiz(p, r, evden){
  const h = r.hava;
  $('#r_sonuc', p).innerHTML = `${h ? `<div class="not ${h.yagis >= 60 ? 'uyari' : ''}">Rüzgâr ${Math.round(h.hiz)} km/sa · ${Math.round(h.sicaklik)}°C · önümüzdeki 3 saatte yağış ihtimali %${h.yagis}${h.yagis >= 60 ? '. Yağmur bekleniyor; içeride bir seans daha iyi olabilir.' : ''}</div>` : ''}
    ${evden ? '<p class="gri" style="font-size:12.5px;margin:4px 0">Kayıtlı adresinizden hesaplandı (konum izni yalnızca güvenli adreste çalışır).</p>' : ''}
    <div id="harita"></div><div class="rotasec">${r.adaylar.map((a, i) => `<button data-no="${a.no}" class="${i === 0 ? 'on' : ''}"><b><span style="color:${ROTA_RENK[i]}">●</span> Döngü ${a.no}</b>${esc(a.aciklama)}</button>`).join('')}</div>
    <div class="salt"><a class="btn ana" id="r_gpx" href="/pt-rota/${r.id}/1.gpx">GPX indir</a></div>
    <p class="gri" style="font-size:12.5px">GPX dosyasını Komoot ya da Garmin'de açın; sürüşte yol tarifini o verir.</p>`;
  if (!(await haritaYukle()) || !p.isConnected) return;
  if (harita){ harita.remove(); harita = null; }
  p.kapaninca = () => { if (harita){ harita.remove(); harita = null; } };
  harita = L.map($('#harita', p), {zoomControl: false, attributionControl: true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '© OpenStreetMap'}).addTo(harita);
  const katman = r.adaylar.map((a, i) => L.polyline(a.koordinat.map(c => [c[0], c[1]]), {color: ROTA_RENK[i], weight: i === 0 ? 5 : 3, opacity: i === 0 ? 1 : .55}).addTo(harita));
  L.circleMarker([r.lat, r.lon], {radius: 6, color: '#fff', fillColor: '#000', fillOpacity: 1}).addTo(harita);
  if (katman[0]) harita.fitBounds(katman[0].getBounds(), {padding: [20, 20]});
  $$('.rotasec button', p).forEach(b => b.onclick = () => { const i = r.adaylar.findIndex(a => a.no === +b.dataset.no);
    $$('.rotasec button', p).forEach(x => x.classList.toggle('on', x === b)); katman.forEach((k, j) => k.setStyle({weight: j === i ? 5 : 3, opacity: j === i ? 1 : .55})); katman[i].bringToFront(); harita.fitBounds(katman[i].getBounds(), {padding: [20, 20]});
    $('#r_gpx', p).href = `/pt-rota/${r.id}/${b.dataset.no}.gpx`; });
}

/* ------------------------------------------------------------------ PLAN */
async function planCiz(hafta){
  const m = $('#main'), sek0 = S.sek + '|' + S.alt;
  let r; try{ r = await api('/api/pt/program' + (hafta ? '?hafta=' + hafta : '')); if (!hafta) store.set('pt_plan', JSON.stringify(r)); }catch(e){ r = JSON.parse(store.get('pt_plan', 'null')); if (!r){ m.innerHTML = '<div class="kart">Plan alınamadı.</div>'; return; } }
  if (S.sek + '|' + S.alt !== sek0) return;
  const pl = r.program || {}, bug = bugunT(), done = new Set(), o = S.o;
  const gunler = pl.gunler || [];
  const aralik = r.gunler && r.gunler.length ? haftaYazi(r.hafta) : '';
  let h = `<div class="satir ara"><p class="mono" style="margin:0">${esc(aralik)}${pl.hafif ? ' · hafif hafta' : ''}</p>${r.sonraki_var || r.hafta === r.sonraki ? `<div class="seg" id="haftaSec"><button data-v="${r.bu}" class="${r.hafta === r.bu ? 'on' : ''}">Bu hafta</button><button data-v="${r.sonraki}" class="${r.hafta === r.sonraki ? 'on' : ''}">Gelecek hafta</button></div>` : ''}</div><h1 class="bas">Bu hafta.</h1>${pl.not ? `<p class="alti">${esc(pl.not)}</p>` : '<p class="alti"></p>'}`;
  if ((o.calisan || {}).plan) h += `<div class="kart"><div class="satir"><span class="donen"></span><b>Haftanızı yazıyorum</b></div></div>`;
  if (!gunler.length) h += `<div class="kart"><b>Bu hafta için plan yok.</b><div style="margin-top:10px"><button class="btn ana genis" data-yaz>Haftamı yaz</button></div></div>`;
  const gorunen = gunler.filter(g => !(g.tarih < bug && g.tur === 'dinlenme'));
  h += `<div class="kart"><div class="hafta">${gorunen.map(g => { const gecti = g.tarih < bug, bugun = g.tarih === bug;
      const alt = [String(g.baslik || '').toLocaleLowerCase('tr').startsWith(String(TUR_AD[g.tur] || '').toLocaleLowerCase('tr')) ? '' : TUR_AD[g.tur], g.sure_dk ? g.sure_dk + ' dk' : '', g.tasindi ? 'taşındı' : ''].filter(Boolean).join(' · ');
      return `<div class="hgun ${bugun ? 'bugun' : ''} ${gecti ? 'gecti' : ''}" data-id="${esc(g.id)}"><div class="tar">${esc(GUN_KISA[(new Date(g.tarih + 'T12:00').getDay() + 6) % 7])}<b>${+g.tarih.slice(8)}</b></div>
        <div style="min-width:0"><b style="font-size:15px">${esc(g.baslik || TUR_AD[g.tur])}</b>${alt ? `<div class="gri" style="font-size:13px">${esc(alt)}</div>` : ''}</div>
        <div class="turikon" style="width:34px;height:34px">${IKON[g.tur] || IKON.kalistenik}</div>
        <div class="hacik hidden"></div></div>`; }).join('')}</div></div>`;
  if (r.hafta === r.bu && o.doz) h += dozHtml(o.doz);
  if ((pl.eger_ise || []).length) h += `<h2 class="bolum">Bir şey değişirse</h2><div class="kart">${pl.eger_ise.map(x => `<div class="lsatir" style="font-size:14.5px">${esc(x)}</div>`).join('')}</div>`;
  h += `<div class="sohbetsatir" style="margin-top:6px"><input id="p_istek" placeholder="Değişiklik isteyin: perşembe yoldayım…" enterkeyhint="send"><button data-yaz aria-label="Haftayı yeniden yaz">↑</button></div>
    <div class="satir" style="margin-top:10px">${r.geri_var ? '<button class="metin" data-geri>Önceki plana dön</button>' : ''}<a class="metin" href="/api/pt/takvim.ics?hafta=${esc(r.hafta)}">Takvime ekle</a></div>`;
  h += `<details class="kart" style="margin-top:18px"><summary class="gri2" style="cursor:pointer;font-size:14.5px">Health nasıl karar veriyor?</summary>${(o.kurallar || []).map(x => `<div class="lsatir" style="font-size:14px;color:var(--ink2)">${esc(x)}</div>`).join('')}</details>`;
  m.innerHTML = altSekHtml() + h; altSekBagla();
  $$('#haftaSec button', m).forEach(b => b.onclick = () => planCiz(b.dataset.v === r.bu ? null : b.dataset.v));
  $$('[data-yaz]', m).forEach(b => b.onclick = () => planYaz(($('#p_istek') || {}).value || '', r.hafta));
  const pi = $('#p_istek', m); if (pi) pi.onkeydown = e => { if (e.key === 'Enter' && pi.value.trim()){ e.preventDefault(); planYaz(pi.value, r.hafta); } };
  $$('[data-geri]', m).forEach(b => b.onclick = async () => { await api('/api/pt/program/geri-al', json({hafta: r.hafta})); toast('Önceki plana dönüldü.'); planCiz(); yukle(true); });
  $$('.hgun', m).forEach(el => el.onclick = e => { if (e.target.closest('.hacik')) return; const ac = $('.hacik', el); const g = gunler.find(x => x.id === el.dataset.id);
    if (!ac.classList.contains('hidden')){ ac.classList.add('hidden'); return; }

/* ------------------------------------------------------------------ BESLENME */
function grafik(tr){
  const N = tr.filter(x => x[2] != null); if (N.length < 2) return '<p class="gri" style="font-size:13.5px">Birkaç gün tartıldıktan sonra kilo gidişiniz burada görünür. Haftada birkaç kez, sabah aç karna yeter.</p>';
  const W = 640, H = 150, D = tr.length, v = N.flatMap(x => [x[2], x[1]].filter(y => y != null)), mn = Math.min(...v) - .3, mx = Math.max(...v) + .3;
  const X = i => 24 + i / (D - 1) * (W - 34), Y = y => 10 + (mx - y) / (mx - mn) * (H - 30);
  const tl = tr.map((x, i) => x[2] != null ? `${X(i).toFixed(1)},${Y(x[2]).toFixed(1)}` : null).filter(Boolean).join(' ');
  return `<svg class="grafik" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line class="eks" x1="24" x2="${W}" y1="${Y(mx - .3)}" y2="${Y(mx - .3)}"/><line class="eks" x1="24" x2="${W}" y1="${Y(mn + .3)}" y2="${Y(mn + .3)}"/>
    <text x="0" y="${Y(mx - .3) + 3}">${(mx - .3).toFixed(1)}</text><text x="0" y="${Y(mn + .3) + 3}">${(mn + .3).toFixed(1)}</text>
    ${tr.map((x, i) => x[1] ? `<circle class="ham" cx="${X(i)}" cy="${Y(x[1])}" r="2.2"/>` : '').join('')}<polyline class="tr" points="${tl}"/></svg>`;
}
function beslenmeCiz(){

  const tr = o.trend || [], sonTrend = [...tr].reverse().find(x => x[2] != null);

    <div><span class="mono">Protein</span><div class="sayi">${t.protein}<small> / ${h.protein || '–'} g</small></div><div class="ilerleme"><i style="width:${yuzde(t.protein, h.protein)}%"></i></div></div></div>
    ${h.protein ? `<p class="gri" style="font-size:13px;margin:10px 0 0">Her öğünde yaklaşık ${h.ogun_protein} g protein (${(S.o.profil.beslenme || {}).ogun_sayisi || 2} öğün).${t.kcal ? ` Yağ ${t.yag} g · karbonhidrat ${t.karb} g.` : ''}</p>${t.lif || t.doymus ? `<p class="gri" style="font-size:13px;margin:6px 0 0">Lif <b>${t.lif}</b> / en az ${h.lif} g · doymuş yağ <b${t.doymus > h.doymus_ust ? ' style="color:var(--turuncu)"' : ''}>${t.doymus}</b> / en çok ${h.doymus_ust} g${h.kolesterol ? ' (kolesterol notunuz için)' : ''}.</p>` : ''}` : '<p class="gri" style="font-size:13px;margin:10px 0 0">Boy, kilo ve doğum tarihinizi Siz sekmesinden girince hedefleriniz hesaplanır.</p>'}</div>`;
  html += pencereKart(true);
  html += `<h2 class="bolum">Öğünler</h2><div class="kart">${(d.yemekler || []).map(y => { const k = y.kalemler || [], kc = Math.round(k.reduce((a, x) => a + (+x.kcal || 0), 0)), pr = Math.round(k.reduce((a, x) => a + (+x.protein || 0), 0));
      return `<div class="lsatir"${y.kontrol ? ` data-kontrol="${esc(y.id)}" style="cursor:pointer"` : ''}>${y.foto ? `<img class="yk" src="/pt-yemek-foto/${esc(y.id)}.jpg" alt="">` : ''}<div class="lgovde"><b>${esc(y.ad)}${y.kontrol ? ' <span class="rozetk">kontrol edin</span>' : ''}</b><small>${new Date(y.t * 1000).toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'})} · ${kc} kcal · ${pr} g protein · ${esc(k.map(x => x.ad).join(', '))}</small></div><button class="metin sessiz" data-ysil="${esc(y.id)}">Sil</button></div>`; }).join('') || '<p class="gri" style="margin:0;font-size:14px">Henüz kayıt yok.</p>'}
    <div class="satir" style="margin-top:12px">${hizliFotoHtml('btn ana')}<button class="btn" data-yemek>Yazarak ekle</button>${o.dun_ogun ? '<button class="btn" data-dunku>Dünkü gibi</button>' : ''}<button class="btn" data-oneri>Bugün ne yesem?</button></div>
    ${(b.son || []).length ? `<span class="etk">Her zamanki</span><div class="cipler">${b.son.slice(0, 8).map((x, i) => `<button data-hep="${i}">${esc(x.ad)}</button>`).join('')}</div>` : ''}
    ${(d.yemekler || []).length ? `<label class="satir gri" style="margin-top:12px;font-size:13px"><input type="checkbox" id="eksik" ${d.eksik_kayit ? 'checked' : ''}> Bugün yediklerimin hepsini kaydetmedim <span style="flex-basis:100%;margin-left:26px">Hedefiniz hesaplanırken bu gün sayılmaz.</span></label>` : ''}</div>`;
  html += '<div class="kart" id="menuKart"><div class="satir gri"><span class="donen"></span></div></div>';
  if (d.yemek_onerisi) html += oneriHtml(d.yemek_onerisi);
  html += `<h2 class="bolum">Kilo <span>${sonTrend ? sonTrend[2].toFixed(1).replace('.', ',') + ' kg ortalama' : ''}</span></h2><div class="kart">${grafik(tr)}
    <div class="satir" style="margin-top:10px"><input class="alan kisa" id="k_kilo" inputmode="decimal" placeholder="kg" value="${d.kilo ?? ''}"><input class="alan kisa" id="k_bel" inputmode="decimal" placeholder="bel cm" value="${d.bel_cm ?? ''}"><button class="btn" id="k_kaydet">Kaydet</button></div>
    <p class="gri" style="font-size:12.5px;margin:8px 0 0">Tartı günden güne oynar; çizgiye bakın.</p></div>`;
  html += takviyeKart();
  m.innerHTML = html;
  bugunBagla(m); orucBagla(m);
  hizliFotoBagla(m); kontrolBagla(m);
  $$('[data-ysil]', m).forEach(x => x.onclick = async e => { e.stopPropagation(); await api(`/api/pt/yemek/${bugunT()}/${x.dataset.ysil}`, {method: 'DELETE'}); yukle(); });
  $$('[data-hep]', m).forEach(x => x.onclick = () => yemekSayfa(b.son[+x.dataset.hep]));
  $('[data-oneri]', m).onclick = async e => { const bt = e.target; bt.disabled = true; bt.innerHTML = '<span class="donen"></span> Düşünüyorum'; try{ await api('/api/pt/yemek-onerisi', json({tarih: bugunT()})); await yukle(); }catch(er){ toast(er.message); bt.disabled = false; bt.textContent = 'Bugün ne yesem?'; } };
  if ($('#eksik', m)) $('#eksik', m).onchange = e => api('/api/pt/eksik-kayit', json({tarih: bugunT(), eksik: e.target.checked}));
  menuKart();
  $('#k_kaydet', m).onclick = async () => { try{ await gonder('/api/pt/kilo', {tarih: bugunT(), kilo: $('#k_kilo').value, bel: $('#k_bel').value}); toast('Kaydedildi.'); yukle(); }catch(e){ toast(e.message); } };
}

/* takviyeler: bilgi, reçete değil; kolesterol notu varsa ona göre */
function takviyeKart(){
  const p = S.o.profil, kol = [...(p.sinirlar || []), ...(p.saglik_degerleri || []).map(x => x.ad + ' ' + x.deger)].some(x => /kolesterol|LDL/i.test(x));
  const kg = p.kilo || 80, prot = Math.round(kg * 1.8);
  const T = [
    ['Kreatin', 'Kuvvette ve kas korumada en çok araştırılmış takviye. Günde 3-5 g, her gün, saati önemsiz. Böbrek hastalığınız varsa kullanmayın.'],
    ['Protein tozu', `Hedefiniz günde ~${prot} g protein. Yemekle yetişmediği günlerde bir ölçek (20-30 g) pratik bir yoldur; şart değil.`],
    ['D vitamini', 'Kuzeyde ekim-mart arası güneş çoğu zaman yetmez. Kan değeri bilinmeden yüksek doz almayın; tahlil yaptırıp doktorunuzla dozu belirleyin.'],
    ['Omega-3', kol ? 'Haftada 2 porsiyon yağlı balık (somon, uskumru) öncelikli. Trigliseridi düşürür; LDL\'ye etkisi sınırlı. Takviye için doktorunuza danışın.' : 'Haftada 2 porsiyon yağlı balık yemiyorsanız günde 1 g EPA+DHA düşünülebilir.'],
    ...(kol ? [['Lif (psyllium)', 'Günde 5-10 g suda çözünen lif LDL\'yi bir miktar düşürür. Yulaf, baklagil ve sebzeyle başlayın; takviye ek olarak.']] : [])];
  return `<h2 class="bolum">Takviyeler</h2><div class="kart"><p class="gri2" style="margin:0 0 6px;font-size:13.5px">Bilgi amaçlı; ilaç kullanıyorsanız ya da bir rahatsızlığınız varsa önce doktorunuza danışın.${kol ? ' Kolesterol notunuzu dikkate aldım.' : ''}</p>
    ${T.map(([a, t]) => `<details class="takviye"><summary>${a}</summary><p>${esc(t)}</p></details>`).join('')}</div>`;
}

  const ileri = r.sonraki && r.sonraki.menu && r.sonraki.menu.gunler ? r.sonraki : null, hd = ileri ? ileri.menu : d, hk = ileri ? ileri.hafta : r.hafta;

/* ürünler: barkod ya da etiket fotoğrafı; yemek eklerken gramla */
