function oneriHtml(o){ return `<div class="kart"><div class="kbas"><h3>Bugün için öneri</h3></div>${(o.ogunler || []).map(x => `<div class="lsatir"><div class="lgovde"><b>${esc(x.saat || '')} · ${esc(x.ad)}</b><small>${esc((x.malzemeler || []).join(', '))}<br>${x.kcal || ''} kcal · ${x.protein || ''} g protein${x.not ? ' · ' + esc(x.not) : ''}</small>${(x.uyari || []).length ? `<div class="not uyari">Hassasiyetinize dokunabilir: ${esc(x.uyari.join(', '))}</div>` : ''}</div></div>`).join('')}${o.ipucu ? `<div class="not">${esc(o.ipucu)}</div>` : ''}</div>`; }
/* Yemek ekle (2026-10-27; kullanıcı: "yediklerimin fotoğrafını atayım, kaloriyi çözümlesin"): fotoğraf seçilince tahmin kendiliğinden başlar;
   en çok 3 fotoğraf (farklı açı ya da yemekten sonra tabakta kalan). Model gram + 100 g değerlerini verir; gram değişince kalori ve protein
   kendiliğinden güncellenir (kcal/protein elle değişirse o satır elle sayılır). Sorunun hazır cevapları yeniden tahmin ettirir. Kaydederken ilk
   tahmin de gider: Health düzeltmelerinizden porsiyon alışkanlığınızı öğrenir. `duzenle`: Paylaş menüsünden gelmiş, kontrol bekleyen öğün. */
function yemekSayfa(hazir, {dosyalar, duzenle} = {}){
  const p = sayfa(`<h3>${duzenle ? 'Öğünü kontrol edin' : 'Yemek ekle'}</h3>
    ${duzenle ? `<p class="gri2" style="margin:0 0 10px;font-size:14px">Telefonunuzdan gelen fotoğraftan tahmin ettim. Gramları düzeltip kaydedin.</p>` : `<p class="gri2" style="margin:0 0 10px;font-size:14px">Fotoğraf çekin; isterseniz bir cümle ekleyin. Yemekten sonra tabakta kalanı da çekerseniz onu düşerim.</p>`}
    <div class="yfotolar" id="y_fotolar">${duzenle && hazir && hazir.foto ? `<img src="/pt-yemek-foto/${esc(hazir.id)}.jpg" alt="">` : ''}</div>
    ${duzenle ? '' : `<div class="satir"><label class="btn">Fotoğraf çek<input type="file" accept="image/*" capture="environment" id="y_kamera" hidden></label><label class="btn">Galeriden<input type="file" accept="image/*" multiple id="y_foto" hidden></label></div>
    <textarea class="alan" id="y_metin" rows="2" style="margin-top:10px" placeholder="İsterseniz yazın: 2 kepçe mercimek çorbası, 1 dilim ekmek"></textarea>
    <div class="salt"><button class="btn ana" id="y_tahmin">Tahmin et</button></div>`}<div id="y_tabak"></div>${duzenle ? '' : '<div id="y_urun"></div>'}`, {sabit: true});
  let fotolar = [], tahmin = duzenle && hazir ? (hazir.tahmin || null) : null, fotoId = null;
  const fotoCiz = () => { const k = $('#y_fotolar', p); k.innerHTML = fotolar.map((f, i) => `<span><img src="${URL.createObjectURL(f)}" alt=""><button data-fsil="${i}" aria-label="Kaldır">✕</button></span>`).join('');
    $$('[data-fsil]', k).forEach(b => b.onclick = () => { fotolar.splice(+b.dataset.fsil, 1); fotoCiz(); }); };
  const ekle = L => { fotolar = fotolar.concat([...L]).slice(0, 3); fotoCiz(); if (fotolar.length) tahminEt(); };
  const kay = k => !k.kaynak ? '' : k.bls ? `<small class="ykay">${k.bls === 'tarif' ? 'Tariften · ' + esc(k.kaynak.replace(/^BLS: tariften \(|\)$/g, '')) : 'BLS · ' + esc(k.kaynak.replace(/^BLS: /, ''))}</small>`
    : k.kaynak === 'Claude tahmini' ? '<small class="ykay tah">Tabloda yok · tahmin</small>' : `<small class="ykay">${esc(k.kaynak)}</small>`;
  const satir = (k, i) => `<tr data-i="${i}"><td><input data-a="ad" value="${esc(k.ad)}">${kay(k)}</td><td><input class="s" data-a="miktar_g" inputmode="decimal" value="${k.miktar_g ?? ''}"></td><td><input class="s" data-a="kcal" inputmode="decimal" value="${Math.round(k.kcal ?? 0)}"></td><td><input class="s" data-a="protein" inputmode="decimal" value="${Math.round(k.protein ?? 0)}"></td><td><button class="metin sessiz" data-sil>✕</button></td></tr>`;
  const tabakCiz = y => { p.__tabak = y;
    const K = y.kalemler || [], top = a => Math.round(K.reduce((s, x) => s + (+x[a] || 0), 0));
    $('#y_tabak', p).innerHTML = `${y.eslesen ? `<div class="not">Bu, sık yediğiniz <b>${esc(y.eslesen.ad)}</b> gibi görünüyor. <button class="metin" id="y_esl">Onun değerlerini kullan</button></div>` : ''}
      <input class="alan" id="y_ad" value="${esc(y.ad || '')}" style="margin-top:14px;font-weight:600">
      <div class="ytoplam"><b id="y_tk">${top('kcal')}</b> kcal · <b id="y_tp">${top('protein')}</b> g protein${y.guven === 'dusuk' ? ' <span class="gri">· emin değilim</span>' : ''}</div>
      <table class="tabak" style="margin-top:8px"><tr><th>Kalem</th><th>g</th><th>kcal</th><th>prot.</th><th></th></tr>${K.map(satir).join('')}</table>
      <div class="satir" style="margin-top:6px"><button class="metin" id="y_yag">+ 1 yemek kaşığı yağ</button><button class="metin" id="y_kalem">+ Kalem</button></div>
      ${y.soru ? `<div class="not" id="y_soru">${esc(y.soru)}${(y.secenekler || []).length ? `<div class="cipler" style="margin-top:8px">${y.secenekler.map(s => `<button data-cvp="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}</div>` : ''}
      ${y.hassasiyet_uyari ? `<div class="not uyari">${esc(y.hassasiyet_uyari)}</div>` : ''}
      <p class="gri" style="font-size:12.5px">${K.some(k => k.kaynak) ? (K.some(k => k.bls) ? 'Besin değerleri Alman besin tablosundan (BLS 4.0, Max Rubner-Institut); gramlar tahmin. ' : '') + 'Gramı değiştirince kalori kendiliğinden güncellenir. Fotoğraflar yağı genelde eksik gösterir.' : ''}</p>
      ${K.some(k => k.kaynak) ? `<div class="sohbetsatir" style="margin:4px 0 10px"><input id="y_duz" placeholder="Yanlış olanı yazın: pilav yarım tabaktı, yağsız pişti…"><button id="y_duzgon" aria-label="Yeniden hesapla">↑</button></div>` : ''}
      <label class="satir" style="font-size:14px"><input type="checkbox" id="y_fav"> Sık yediklerime ekle</label>
      <div class="salt">${duzenle ? '<button class="btn" id="y_sil">Sil</button>' : ''}<button class="btn ana" id="y_kaydet">Kaydet</button></div>`;
    const oku = () => $$('.tabak tr[data-i]', p).map(tr => { const x = {}; $$('input', tr).forEach(i => x[i.dataset.a] = i.dataset.a === 'ad' ? i.value : +String(i.value).replace(',', '.') || 0);
      return {...(K[+tr.dataset.i] || {}), ...x}; });
    const toplamYaz = () => { const L = oku(); $('#y_tk', p).textContent = Math.round(L.reduce((s, x) => s + (+x.kcal || 0), 0)); $('#y_tp', p).textContent = Math.round(L.reduce((s, x) => s + (+x.protein || 0), 0)); };
    $$('.tabak tr[data-i]', p).forEach(tr => { const k = K[+tr.dataset.i];
      $$('input', tr).forEach(i => i.addEventListener('input', () => {
        if (i.dataset.a === 'miktar_g' && k.yuz){ const g = +String(i.value).replace(',', '.') || 0; k.miktar_g = g;
          ['kcal', 'protein', 'yag', 'karb'].forEach(a => k[a] = Math.round(g * (+k.yuz[a] || 0) / 10) / 10);
          $('[data-a="kcal"]', tr).value = Math.round(k.kcal); $('[data-a="protein"]', tr).value = Math.round(k.protein); }
        else if (i.dataset.a === 'kcal' || i.dataset.a === 'protein') delete k.yuz;    // elle girilen sayı gramdan hesaplanmaz
        toplamYaz(); })); });
    $$('[data-sil]', p).forEach(b => b.onclick = () => { y.kalemler = oku(); y.kalemler.splice(+b.closest('tr').dataset.i, 1); tabakCiz(y); });
    $('#y_yag', p).onclick = () => { y.kalemler = oku(); y.kalemler.push({ad: 'Zeytinyağı / tereyağı', miktar_g: 10, yuz: {kcal: 884, protein: 0, yag: 100, karb: 0}, kcal: 88, protein: 0, yag: 10, karb: 0}); tabakCiz(y); };
    $('#y_kalem', p).onclick = () => { y.kalemler = oku(); y.kalemler.push({ad: '', miktar_g: 0, kcal: 0, protein: 0}); tabakCiz(y); };
    $$('[data-cvp]', p).forEach(b => b.onclick = () => tahminEt({soru: y.soru, cevap: b.dataset.cvp}));
    const duz = $('#y_duzgon', p); if (duz){ const git = () => { const v = $('#y_duz', p).value.trim(); if (v) tahminEt({soru: 'Kullanıcının düzeltmesi', cevap: v}); };
      duz.onclick = git; $('#y_duz', p).onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); git(); } }; }
    const esl = $('#y_esl', p); if (esl) esl.onclick = () => tabakCiz({...JSON.parse(JSON.stringify(y.eslesen)), soru: '', eslesen: null});
    const sil = $('#y_sil', p); if (sil) sil.onclick = async () => { await fetch(`/api/pt/yemek/${duzenle.tarih}/${hazir.id}`, {method: 'DELETE'}); p.kapat(); toast('Silindi.'); yukle(); };
    $('#y_kaydet', p).onclick = async () => {
      const yem = {ad: $('#y_ad', p).value || 'Öğün', kalemler: oku(), favori: $('#y_fav', p).checked, tahmin, kontrol: false};
      if (duzenle) Object.assign(yem, {id: hazir.id, t: hazir.t, foto: hazir.foto}); else if (fotoId) Object.assign(yem, {id: fotoId, foto: true});
      try{ await gonder('/api/pt/yemek', {tarih: duzenle ? duzenle.tarih : bugunT(), yemek: yem}); p.kapat(); toast('Kaydedildi.'); yukle(); }catch(e){ toast(e.message); } };
  };
  const tahminEt = async cevap => {
    const metin = ($('#y_metin', p) || {}).value?.trim() || ''; if (!metin && !fotolar.length) return toast('Fotoğraf ya da bir cümle ekleyin.');
    const b = $('#y_tahmin', p); if (b){ b.disabled = true; b.innerHTML = '<span class="donen"></span> Bakıyorum'; }
    if (!cevap) $('#y_tabak', p).innerHTML = '<div class="satir gri" style="margin-top:14px"><span class="donen"></span> Tabağa bakıyorum…</div>';
    else { const s = $('#y_soru', p); if (s) s.innerHTML = '<span class="donen"></span> Cevabınızla yeniden hesaplıyorum'; }
    const f = new FormData(); f.append('metin', metin); fotolar.forEach(x => f.append('foto', x)); if (cevap) f.append('cevap', JSON.stringify(cevap));
    try{ const y = await api('/api/pt/yemek/coz', {method: 'POST', body: f}); fotoId = y.foto_id || fotoId; tahmin = {ad: y.ad, kalemler: JSON.parse(JSON.stringify(y.kalemler))}; tabakCiz(y); }
    catch(e){ toast(e.message); $('#y_tabak', p).innerHTML = ''; }
    if (b){ b.disabled = false; b.textContent = 'Yeniden tahmin et'; if ($('#y_kaydet', p)) b.classList.remove('ana'); } };
  if (!duzenle){ urunBolumu(p, tabakCiz);
    $('#y_foto', p).onchange = e => ekle(e.target.files); $('#y_kamera', p).onchange = e => ekle(e.target.files);
    $('#y_tahmin', p).onclick = () => tahminEt(); }
  if (hazir) tabakCiz(JSON.parse(JSON.stringify(hazir)));
  if (dosyalar && dosyalar.length) ekle(dosyalar);
}

async function beceriKart(){

  if (!r.beceriler.length){ k.innerHTML = '<p class="gri2" style="margin:0;font-size:14px">Bir beceri hedefi seçmediniz. Siz → Düzenle → Hedef\'ten "Beceri öğrenmek"i seçebilirsiniz.</p>'; return; }
  const Z = {}; r.beceriler.forEach(b => b.zincirler.forEach(z => { (Z[z.zincir] = Z[z.zincir] || {...z, hedefler: []}).hedefler.push(b.ad); }));
  const denenir = b => b.zincirler.some(z => z.simdi.son);                 // en az bir kez çalışılmış yol varsa deneme anlamlı

  k.innerHTML = `${r.beceriler.map(b => `<div class="satir ara" style="padding:5px 0"><span style="flex:1"><b>${esc(b.ad)}</b> ${zAd(b) ? `<span class="gri" style="font-size:12.5px">${esc(zAd(b))}</span>` : ''}</span>

    ${r.beceriler.some(denenir) ? '<p class="gri" style="font-size:12.5px;margin:6px 0 2px">"Dene" bir üst basamağı denetir; hedefin altına inmeden yaparsanız geçersiniz.</p>' : '<p class="gri" style="font-size:12.5px;margin:6px 0 2px">Başlangıç testinden sonra her yolda nerede olduğunuz netleşir.</p>'}
    <details id="basamakAc" style="margin-top:10px"><summary class="gri2" style="cursor:pointer;font-size:14.5px">Basamakları göster</summary>${Object.values(Z).map(z => `<div style="margin-top:14px"><div class="satir ara"><b style="font-size:15px">${esc(z.ad)}</b><span class="gri" style="font-size:12px">${esc(z.hedefler.join(', '))} için</span></div>
      <div class="gri2" style="font-size:13px">Şimdi ${esc(z.simdi.ad)} · geçmek için ${esc(z.simdi.sart)}${z.simdi.son ? ` · son: ${z.simdi.son.join(', ')}` : ''}</div>
      <div class="yol">${z.basamaklar.map((s, i) => `${i ? `<div class="cz ${s.durum !== 'kilitli' ? 'dolu' : ''}"></div>` : ''}<div class="dug ${s.durum === 'gecti' ? 'gecti' : s.durum === 'simdi' ? 'simdi' : ''}"><i></i>${esc(s.ad)}</div>`).join('')}</div></div>`).join('')}</details>`;
  const ortala = () => $$('.yol', k).forEach(y => { const s = $('.dug.simdi', y); if (s) y.scrollLeft = Math.max(0, s.getBoundingClientRect().left - y.getBoundingClientRect().left + y.scrollLeft - y.clientWidth / 2 + 42); });
  ortala(); const ba = $('#basamakAc', k); if (ba) ba.ontoggle = ortala;
  $$('[data-deneme]', k).forEach(b => b.onclick = async () => { try{ oynat(await api(`/api/pt/beceri/${b.dataset.deneme}/deneme`)); }catch(e){ toast(e.message); } });
  const d = $('#digerKart'); if (d){ Object.keys(Z).forEach(z => { const x = $(`[data-z="${z}"]`, d); if (x) x.remove(); }); if (!$('[data-z]', d)) d.remove(); }
}

  $('#pDrill', p).onclick = () => { p.kapat(); oynat({tur: 'bjj_solo', baslik: `${x.pozisyon} drilleri`, sure_dk: 10, bolumler: [{ad: 'Drill', bicim: 'tur', tur_sayisi: 3, calisma_sn: 40, dinlenme_sn: 20, hareketler: x.drill.map(d => ({kod: d.kod}))}]}, {asgari: true}); };
  const ekle = async () => { const v = $('#pGir', p).value.trim(); if (!v) return; const r = await api('/api/pt/bjj/not', json({pozisyon: x.pozisyon, metin: v})); x.notlar = r.notlar; p.kapat(); pozSayfa(x); };
  $('#pGon', p).onclick = ekle; $('#pGir', p).onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); ekle(); } };
  $$('[data-sil]', p).forEach(b => b.onclick = async () => { const r = await api('/api/pt/bjj/not', json({pozisyon: x.pozisyon, sil: b.dataset.sil})); x.notlar = r.notlar; p.kapat(); pozSayfa(x); });

async function yorgunlukKart(){

      <polyline points="${cz('kondisyon')}" fill="none" stroke="var(--vurgu)" stroke-width="2.2"/><polyline points="${cz('yorgunluk')}" fill="none" stroke="var(--turuncu)" stroke-width="1.6" stroke-dasharray="4 3"/>

    <div class="satir" style="gap:14px;font-size:12.5px;color:var(--ink2)"><span><b style="color:var(--vurgu)">—</b> Kondisyon (6 hafta)</span><span><b style="color:var(--turuncu)">- -</b> Yorgunluk (1 hafta)</span><span>▮ Günlük yük</span></div>

}

  async abonelik(){ if (!this.destek()) return null; const r = await navigator.serviceWorker.getRegistration('/'); return r ? r.pushManager.getSubscription() : null; },
  async durum(){ if (!this.destek()) return 'yok'; if (Notification.permission === 'denied') return 'red'; return (await this.abonelik()) ? 'acik' : 'kapali'; },
  async ac(){ const izin = await Notification.requestPermission(); if (izin !== 'granted') throw new Error('Bildirim izni verilmedi.');
    const r = await navigator.serviceWorker.register('/pt-sw.js', {scope: '/'}); await navigator.serviceWorker.ready;
    const {anahtar} = await api('/api/pt/push/anahtar'); const ham = atob(anahtar.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((anahtar.length + 3) % 4));
    const s = await r.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: Uint8Array.from(ham, c => c.charCodeAt(0))});
    await api('/api/pt/push/abone', json({sub: s.toJSON(), cihaz: (navigator.userAgent.match(/\(([^)]+)\)/) || [, ''])[1]})); },
  async kapat(){ const s = await this.abonelik(); if (s){ await api('/api/pt/push/sil', json({endpoint: s.endpoint})); await s.unsubscribe(); } },
};

  e._git = j => { dur = true; git(j); }; }); }

function ytKutu(kod){ const y = kat(kod).youtube; if (!y) return '';
  return `<span class="etk">Videolu anlatım</span><button class="yt" data-yt="${esc(y.id)}"><img src="https://i.ytimg.com/vi/${esc(y.id)}/mqdefault.jpg" alt="" loading="lazy"><span class="yt-oy">▶</span></button>
    <div class="yt-bilgi"><span>${esc(y.baslik)}</span><small>${esc(y.kanal)} · ${ytSure(y.sure || 0)} · <a href="https://www.youtube.com/watch?v=${esc(y.id)}" target="_blank" rel="noopener">YouTube'da aç ↗</a></small></div>`; }
function ytBagla(k){ $$('[data-yt]', k).forEach(b => b.onclick = () => { const f = document.createElement('iframe'); f.className = 'yt'; f.allow = 'autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen = true;
  f.src = `https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1&rel=0&playsinline=1`; b.replaceWith(f); }); }

/* hareket kartı: video, 3 adım, sık hatalar, kaslar, kolay/zor basamak */
/* çalışan kaslar: asıl çalışanlar gerçekçi görselle (pt_medya/_kas), yardım edenler yazıyla */
function kasGorsel(kaslar){
  const b1 = (kaslar && kaslar.birincil) || [], b2 = (kaslar && kaslar.ikincil) || [], G = S.kat.kas_gorsel || {}, ad = k => (S.kat.kas_ad || {})[k] || k;
  if (!b1.length && !b2.length) return '';
  const foto = b1.filter(k => G[k]);
  return `${foto.length ? `<div class="kasfoto">${foto.map(k => `<figure><img src="/pt-kas/${k}.jpg?t=${G[k]}" alt="" loading="lazy"><figcaption>${esc(ad(k))}</figcaption></figure>`).join('')}</div>` : ''}
    <div class="kasyazi">${b1.filter(k => !G[k]).length ? `<b>${b1.filter(k => !G[k]).map(ad).join(', ')}</b>` : ''}${b2.length ? `<span>Yardım eden: ${b2.map(ad).join(', ')}</span>` : ''}</div>`;
}
function hareketKart(kod, {oynatici} = {}){
  const k = kat(kod), kr = k.kart || {}, kolay = komsuBasamak(kod, -1), zor = komsuBasamak(kod, 1);
  const kendi = k.kendi || (k.video && !k.ornek);
  const p = sayfa(`<div class="hkart">
    ${k.video ? `<video src="${k.video}?t=${k.video_zaman || ''}" ${k.kapak ? `poster="${k.kapak}"` : ''} autoplay loop muted playsinline></video>` : (k.kareler || []).length ? sbKutu(kod, 'buyuk') : `<div class="vyok">Bu hareketin görselleri henüz hazırlanıyor.</div>`}
    <div class="hk-ust"><h3 style="margin:0;font-size:21px;letter-spacing:-.01em">${esc(k.ad)}</h3><div class="satir" style="gap:8px;flex-wrap:nowrap">${k.video ? `<div class="seg" id="hk_hiz"><button data-v="1" class="on">1×</button><button data-v=".5">½×</button></div>` : ''}<button class="imibtn ${S.kit && S.kit.kaydedilen.includes(kod) ? 'on' : ''}" id="hk_imi" aria-label="Kaydet">${IMI}</button></div></div>
    ${k.aciklama ? `<p class="gri2" style="margin:4px 0 0;font-size:14px">${esc(k.aciklama)}</p>` : ''}
    ${(kr.adimlar || []).length ? `<span class="etk">Nasıl yapılır</span><ol class="adimlar">${kr.adimlar.map((a, i) => { const K = k.kareler || [], f = K.length === 3 ? K[i] : (i === 0 && K.length === 1 ? K[0] : null);
        return `<li ${f ? `class="fotolu${i ? '' : ' on'}" data-sbadim="${esc(kod)}"` : ''}>${f ? `<img src="${f.k}" alt="" loading="lazy">` : ''}<span>${esc(a)}</span></li>`; }).join('')}</ol>` : ''}
    ${(kr.adimlar || []).length ? `<button class="metin" id="hk_dinle">Sesli anlat</button>` : ''}
    ${kr.hisset ? `<span class="etk">Nerede hissetmelisiniz</span><p style="margin:0;font-size:14.5px">${esc(kr.hisset)}</p>` : ''}
    ${kr.nefes ? `<div class="not">${esc(kr.nefes)}</div>` : ''}
    ${(kr.hatalar || []).length ? `<span class="etk">Sık yapılan hatalar</span>${kr.hatalar.map(h => `<div class="hata">${esc(h)}</div>`).join('')}` : ''}
    <div id="hkGecmis"></div>
    ${ytKutu(kod)}
    ${kasGorsel(kr.kaslar) || k.anatomi ? `<span class="etk">Çalışan kaslar</span>${k.anatomi ? `<img class="anatomi" src="${k.anatomi.b}" alt="" loading="lazy">` : ''}${kasGorsel(kr.kaslar)}` : ''}
    ${kolay || zor ? `<span class="etk">Basamaklar</span><div class="komsu">${kolay ? `<button data-hk2="${kolay}"><span>Daha kolay</span>${esc(kat(kolay).ad)}</button>` : ''}${zor ? `<button data-hk2="${zor}"><span>Daha zor</span>${esc(kat(zor).ad)}</button>` : ''}</div>` : ''}
    ${k.ornek ? '<p class="gri" style="font-size:12px;margin:14px 0 0">Video yapay zekâyla üretildi; kendi videonuzu Siz\'den ekleyebilirsiniz, o zaman sizinki görünür.</p>' : ''}
    <div class="salt">${kendi ? '<button class="btn" id="hk_duzen">Düzenle</button>' : ''}${oynatici ? '<button class="btn ana" data-kapat>Antrenmana dön</button>' : `<button class="btn" data-kapat>Kapat</button>${k.tur === 'isinma' ? '' : '<button class="btn ana" id="hk_simdi">Şimdi yap</button>'}`}</div></div>`, {kapaninca: oynatici});
  hareketGecmisDoldur(kod, $('#hkGecmis', p));
  const im = $('#hk_imi', p); if (im) im.onclick = async () => { await kitaplikVerisi(); imiDegis(kod, im); };
  const sy = $('#hk_simdi', p); if (sy) sy.onclick = () => { p.remove(); simdiYap(kod); };
  const v = $('video', p);
  sbBaslat(p); ytBagla(p);
  $$('[data-sbadim]', p).forEach((li, i) => li.onclick = () => { const s = $('[data-sb]', p); if (s && s._git) s._git(i); });
  segBagla(p, (g, b) => { if (v) v.playbackRate = +b.dataset.v; });
  const dn = $('#hk_dinle', p); if (dn) dn.onclick = () => { if (soyle([`${k.ad}.`, ...kr.adimlar], {zorla: true})) toast('Bu hareketin sesi hazırlanıyor; birkaç dakika sonra dinleyebilirsiniz.'); };
  $$('[data-hk2]', p).forEach(b => b.onclick = () => { p.remove(); hareketKart(b.dataset.hk2, {oynatici}); });
  const dz = $('#hk_duzen', p); if (dz) dz.onclick = () => { p.remove(); hareketSayfa(kod); };
}
document.addEventListener('click', e => { const h = e.target.closest('[data-hk]'); if (h && !e.target.closest('.oyn')) hareketKart(h.dataset.hk); });
function hareketSayfa(kod, yeni){
  const k = kat(kod);
  const p = sayfa(`${yeni ? '<p class="mono" style="color:var(--vurgu)">Eklendi</p>' : ''}<video src="${k.video}?t=${k.video_zaman || ''}" autoplay loop muted playsinline style="width:100%;border-radius:14px;max-height:340px;background:#000"></video>
    <span class="etk">Adı</span><input class="alan" id="h_ad" value="${esc(k.ad)}">
    <span class="etk">Nasıl yapılır</span><textarea class="alan" id="h_ac" rows="2">${esc(k.aciklama || '')}</textarea>
    <span class="etk">Form ipuçları (her satıra bir)</span><textarea class="alan" id="h_ip" rows="3">${esc((k.ipuclari || []).join('\n'))}</textarea>
    ${k.kendi ? '<p class="gri" style="font-size:12.5px">Bu hareket katalogda yok; Health planı yazarken bunu da kullanabilir.</p>' : ''}
    <div class="salt"><button class="btn" id="h_sil" style="color:var(--kirmizi)">Kaldır</button><button class="btn ana" id="h_kaydet">Kaydet</button></div>`);
  if (oynatici) p.kapaninca = oynatici;
  $('#h_kaydet', p).onclick = async () => { await api('/api/pt/hareket/' + kod, json({ad: $('#h_ad', p).value, aciklama: $('#h_ac', p).value, ipuclari: $('#h_ip', p).value.split('\n').map(x => x.trim()).filter(Boolean)})); p.kapat(); S.kat = null; toast('Kaydedildi.'); yukle(); };
  $('#h_sil', p).onclick = async () => { await api('/api/pt/hareket/' + kod, {method: 'DELETE'}); p.kapat(); S.kat = null; toast('Kaldırıldı.'); yukle(); };
}

/* ------------------------------------------------------------------ puan şeridi, değerlendirme, hedefler, ara kontrol, günün planı (2026-10-30;
   kullanıcı: "gerçek uzmanlarla başlıyormuşum gibi; kısa orta uzun vadeli hedefler; ara kontroller; günlük yapılacaklar soru işaretsiz; Duolingo gibi puan") */
const VADE_KISA = {kisa: '4 hafta', orta: '3 ay', uzun: '1 yıl'}, VADE_AD = {kisa: 'Kısa vade', orta: 'Orta vade', uzun: 'Uzun vade'};
function puanSerit(){
  const y = S.o.oyun; if (!y) return '';
  const P = y.puan || {}, b = y.bugun, sv = P.seviye || {}, r = 19, cv = 2 * Math.PI * r, oran = Math.min(1, (P.bugun || 0) / (P.hedef || 100));
  const alt = y.seri ? (y.risk ? 'Seriniz bu gece biter' : b.durum === 'tamam' ? 'Bugünün hedefi tamam' : y.sonraki_esik ? `${y.sonraki_esik} güne ${y.sonraki_esik - y.seri} gün` : '') : (b.durum === 'tamam' ? 'Seri başladı' : esc(b.metin || ''));
  return `<button class="durum ${y.risk ? 'risk' : ''}" id="durumBtn" aria-label="Seri, puan ve seviye">
    <span class="d-seri">${ALEV(y.seri || b.durum === 'tamam' ? 'alev' : 'alev sonuk', 'style="width:26px;height:26px"')}<span><b>${y.seri}</b><small>${y.seri === 1 ? 'gün' : 'gün seri'}</small></span></span>
    <span class="d-puan ${P.gun_tamam ? 'ok' : ''}"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--yuzey3)" stroke-width="5"/><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--vurgu)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${cv}" stroke-dashoffset="${cv * (1 - oran)}" transform="rotate(-90 23 23)"/></svg><span><b>${P.bugun || 0}</b><small>/ ${P.hedef || 100} puan</small></span></span>
    <span class="d-sev"><small>Seviye ${sv.no || 1} · ${esc(sv.ad || '')}</small><i><u style="width:${Math.round((sv.oran || 0) * 100)}%"></u></i><small>${sv.ust ? `${sv.kalan} puana ${esc(sv.sonraki || '')}` : `${(sv.toplam || 0).toLocaleString('tr-TR')} puan`}</small></span>
    <span class="d-alt ${b.durum === 'tamam' ? 'ok' : ''}">${alt}${y.koruma ? ` · ${y.koruma} koruma` : ''}</span></button>`;
}
function degerlendirmeKart(){
  const d = S.o.degerlendirme || {};
  if (d.hazirlaniyor && !d.var) return `<div class="kart"><div class="satir"><span class="donen"></span><b>Değerlendirmenizi yazıyorum</b></div><p class="gri2" style="margin:6px 0 0;font-size:14px">Sizi nasıl gördüğümü, hangi antrenman ve beslenme yaklaşımının size uyduğunu ve nedenlerini yazıyorum; bir dakika sürer.</p></div>`;
  if (!d.var || d.okundu) return '';
  return `<div class="kart vurgulu deger"><span class="mono">Health'in değerlendirmesi</span><h3>Sizi böyle gördüm.</h3><p>${esc(d.mesaj || '')}</p>
    <div class="hsatir"><span>Antrenman</span><span>${esc(d.antrenman || '')}</span></div><div class="hsatir"><span>Beslenme</span><span>${esc(d.beslenme || '')}</span></div>
    <button class="btn ana genis" style="margin-top:10px" data-deger>Tamamını oku</button></div>`;
}
async function degerlendirmeSayfa(){
  const p = sayfa('<div class="satir gri"><span class="donen"></span> Alınıyor</div>');
  let r; try{ r = await api('/api/pt/degerlendirme'); }catch(e){ p.kapat(); return toast(e.message); }
  const d = r.degerlendirme || {};
  if (!d.mesaj){ $('.sayfa', p).innerHTML = `<div class="tutac"></div><h3>Değerlendirme</h3><p class="gri2">${r.hazirlaniyor ? 'Yazılıyor; bir dakika sonra yeniden bakın.' : (r.hata ? 'Yazılamadı: ' + esc(r.hata) : 'Henüz yazılmadı.')}</p><div class="salt">${r.hazirlaniyor ? '' : '<button class="btn" id="dgYaz">Şimdi yaz</button>'}<button class="btn ana" data-kapat>Kapat</button></div>`;
    const y = $('#dgYaz', p); if (y) y.onclick = async () => { await api('/api/pt/degerlendirme', json({yenile: true})); p.kapat(); toast('Yazıyorum; bir dakika sürer.'); yukle(); }; return; }
  const H = S.o.hedefler || {}, bekleyen = H.bekleyen_oneri;
  const blok = (bas, x) => x && (x.yaklasim || x.aciklama) ? `<h4 class="dbas">${bas}</h4><p class="dyak">${esc(x.yaklasim || '')}</p><p class="gri2" style="margin:4px 0 0;font-size:14.5px">${esc(x.aciklama || '')}</p>${x.neden ? `<div class="not">Neden: ${esc(x.neden)}</div>` : ''}` : '';
  $('.sayfa', p).innerHTML = `<div class="tutac"></div><span class="mono">Health'in değerlendirmesi${d.eski ? ' · profiliniz değişti' : ''}</span><h3>Sizi böyle gördüm.</h3><p style="margin:4px 0 2px;font-size:15.5px">${esc(d.mesaj)}</p>
    ${blok('Antrenman yaklaşımınız', d.antrenman)}${blok('Beslenme yaklaşımınız', d.beslenme)}
    ${d.uzun_omur && d.uzun_omur.ozet ? `<h4 class="dbas">Uzun ömür</h4><p class="gri2" style="margin:0;font-size:14.5px">${esc(d.uzun_omur.ozet)}</p>${d.uzun_omur.olcum ? `<div class="not">${esc(d.uzun_omur.olcum)}</div>` : ''}` : ''}
    ${(d.ekip || []).length ? `<h4 class="dbas">Ekibiniz ne diyor</h4><div class="dekip">${d.ekip.map(x => `<div><span>${esc(x.uzman)}</span><p>${esc(x.not)}</p></div>`).join('')}</div>` : ''}
    ${(d.dikkat || []).length ? `<h4 class="dbas">Dikkat edeceklerimiz</h4><ul class="adimlar">${d.dikkat.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${(d.ilk_adimlar || []).length ? `<h4 class="dbas">Bu hafta</h4><ul class="adimlar">${d.ilk_adimlar.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${d.kontrol ? `<h4 class="dbas">Ara kontrol</h4><p class="gri2" style="margin:0;font-size:14.5px">${esc(d.kontrol)}</p>` : ''}
    <div class="salt">${d.eski ? '<button class="btn" id="dgYenile">Yeniden yaz</button>' : ''}<button class="btn ana" id="dgTamam">${bekleyen ? 'Hedefleri belirleyelim' : 'Tamam'}</button></div>`;
  $('#dgTamam', p).onclick = async () => { try{ await api('/api/pt/degerlendirme', json({okundu: true})); }catch(e){ /* yok */ } p.kapat(); if (bekleyen) hedefSayfa(); else yukle(true); };
  const yn = $('#dgYenile', p); if (yn) yn.onclick = async () => { await api('/api/pt/degerlendirme', json({yenile: true})); p.kapat(); toast('Yeniden yazıyorum; bir dakika sürer.'); yukle(); };
}
function hedefSatir(h, kisa){
  const oran = h.oran == null ? 0 : Math.round(h.oran * 100), R = {tamam: 'yesil', yolunda: 'yesil', geride: 'sari', gecti: 'kirmizi', elle: '', bilinmiyor: ''}[h.yolda] || '';
  return `<div class="hrow"><span class="hv">${VADE_KISA[h.vade] || ''}</span><div class="hm"><b>${esc(h.metin)}</b>${kisa ? '' : `<small>${esc([h.simdi_metni ? 'şu an ' + h.simdi_metni : '', h.kalan_gun > 0 ? `${h.kalan_gun} gün kaldı` : ''].filter(Boolean).join(' · '))}</small>`}<i><u class="${R}" style="width:${oran}%"></u></i></div><span class="hd ${R}">${esc(h.durum_metni || '')}</span></div>`;
}
function hedefKart(kisa){

/* Bu hafta: üç halka (güç, kolay kardiyo, denge) dolarak açılır; yanında bugünkü seansın halkaya etkisi ve tek birincil düğme. */

/* Uzman ekibi şeması: her uzmandan programdaki parçasına akan ışık. Reçete ekranının başında. */
function ekipSema(r, rc){
  const S_ = rc.satirlar || [], M = rc.moduller || [], has = k => S_.some(x => x.kod === k);
  const sag = [], baglar = [];
  const ekle = (ad, uzman) => { let i = sag.indexOf(ad); if (i < 0){ sag.push(ad); i = sag.length - 1; } baglar.push([uzman, i]); };
  S_.forEach(x => ekle(x.ad, {kalistenik: 'Antrenör', bisiklet: 'Dayanıklılık koçu', kardiyo: 'Dayanıklılık koçu', bjj_ders: 'Jiu-jitsu koçu', bjj_solo: 'Jiu-jitsu koçu', flow: 'Fizyoterapist', mobilite: 'Fizyoterapist'}[x.kod] || 'Antrenör'));
  M.slice(0, 3).forEach(m => ekle(m.ad, ['uyku', 'isik'].includes(m.kod) ? 'Uyku ve toparlanma koçu' : m.kod === 'hara' ? 'Diyetisyen' : m.kod === 'mola' ? 'Fizyoterapist' : 'Zihin-beden uzmanı'));
  ekle('Beslenme', 'Diyetisyen'); ekle('Haftalık sağlık dozu', 'Uzun ömür uzmanı'); ekle('Günlük görevler ve seri', 'Alışkanlık koçu');
  const sol = (r.uzmanlar || []).map(u => u.ad).filter(a => baglar.some(b => b[0] === a) || a === 'Uyku ve toparlanma koçu');
  if (!baglar.some(b => b[0] === 'Uyku ve toparlanma koçu')) ekle('Uyku', 'Uyku ve toparlanma koçu');
  const n = Math.max(sol.length, sag.length), H = n * 30 + 16, yL = i => 16 + i * (H - 32) / Math.max(1, sol.length - 1), yR = i => 16 + i * (H - 32) / Math.max(1, sag.length - 1);
  const yol = baglar.map(([u, j], k) => { const i = sol.indexOf(u); if (i < 0) return ''; const a = yL(i), b = yR(j);
    const d = `M158 ${a} C 212 ${a}, 212 ${b}, 266 ${b}`;
    return `<path d="${d}" class="es-cz"/><path d="${d}" class="es-ak" style="animation-delay:${(k * 0.41) % 2.8}s"/>`; }).join('');
  return `<div class="esema"><svg viewBox="0 0 424 ${H}" role="img" aria-label="Programı yazan uzman ekibi ve her birinin programdaki payı">${yol}
    ${sol.map((a, i) => `<circle cx="158" cy="${yL(i)}" r="3.2" class="es-n"/><text x="150" y="${yL(i) + 3.5}" text-anchor="end" class="es-t">${esc(a)}</text>`).join('')}
    ${sag.map((a, i) => `<circle cx="266" cy="${yR(i)}" r="4" class="es-n2"/><text x="275" y="${yR(i) + 3.5}" class="es-t2">${esc(a)}</text>`).join('')}</svg></div>`;
}

/* Yaşla kardiyo kapasitesi: hareketsiz ve antrenmanlı iki yol, bağımsız yaşam eşiği, sizin noktanız. Yaklaşık; büyük izlem çalışmalarının ortalaması. */
function yaslanmaGrafik(vo2, yas, kadin, tahmini){
  yas = Math.max(25, Math.min(75, yas || 40));
  const norm = a => (kadin ? 41 : 47) - (a - 25) * (kadin ? 0.30 : 0.36);
  const v0 = vo2 || norm(yas), ESIK = 18;
  const otur = a => { let v = v0; for (let x = yas; x < a; x++) v *= x < 50 ? 0.99 : x < 70 ? 0.985 : 0.97; return v; };
  const aktif = a => { const k = Math.min(1, (a - yas) / 4), v1 = v0 * (1 + 0.1 * (1 - Math.pow(1 - k, 2))); let v = v1; for (let x = yas + 4; x < a; x++) v *= x < 70 ? 0.995 : 0.98; return v; };
  const A0 = yas, A1 = 95, X = a => 34 + (a - A0) / (A1 - A0) * 300, vmax = Math.max(v0 * 1.15, 30), Y = v => 14 + (1 - Math.min(vmax, v) / vmax) * 150;
  const yolu = f => Array.from({length: A1 - A0 + 1}, (_, i) => `${i ? 'L' : 'M'}${X(A0 + i).toFixed(1)} ${Y(f(A0 + i)).toFixed(1)}`).join(' ');
  const kes = f => { for (let a = A0; a <= A1; a++) if (f(a) < ESIK) return a; return null; };
  const ko = kes(otur), ka = kes(aktif);
  const etk = [];
  for (let a = Math.ceil(A0 / 10) * 10; a <= A1; a += 10) etk.push(`<text x="${X(a)}" y="184" class="yg-e" text-anchor="middle">${a}</text>`);
  return `<div class="yg"><svg viewBox="0 0 340 192" role="img" aria-label="Yaşla kardiyo kapasitesi: hareketsiz ve düzenli antrenmanla">
    <line x1="34" x2="334" y1="${Y(ESIK)}" y2="${Y(ESIK)}" class="yg-esik"/><text x="38" y="${Y(ESIK) + 13}" class="yg-et">bağımsız yaşam eşiği</text>
    <path d="${yolu(otur)}" class="yg-otur"/><path d="${yolu(aktif)}" class="yg-aktif"/>
    ${ko ? `<circle cx="${X(ko)}" cy="${Y(ESIK)}" r="3" class="yg-kes"/>` : ''}${etk.join('')}
    <circle cx="${X(yas)}" cy="${Y(v0)}" r="5" class="yg-siz"/><circle cx="${X(yas)}" cy="${Y(v0)}" r="5" class="yg-dalga"/></svg>
    <div class="yg-lej"><span><i class="a"></i>Haftalık doz tamam</span><span><i class="o"></i>Hareketsiz</span><span><i class="s"></i>Siz${tahmini ? ' (yaşınızın ortalaması)' : ''}</span></div>
    <p class="gri2" style="margin:8px 0 0;font-size:13.5px">${ko ? `Hareketsiz yolda kardiyo kapasitesi yaklaşık <b>${ko}</b> yaşında bağımsız yaşam eşiğine iner; düzenli dozla ${ka ? `<b>${ka}</b> yaşına kadar` : '95 yaşından sonra da'} üstünde kalır.` : 'İki yol da eşiğin üstünde; fark yaşlandıkça açılır.'} Aradaki farkı haftalık doz yaratır.</p>
    <small class="gri" style="font-size:11.5px">Yaklaşık: büyük izlem çalışmalarının ortalaması; kişiden kişiye değişir.</small></div>`;
}

/* Nefes oynatıcısı: tam ekran, halka nefesle büyüyüp küçülür, çevresinde süre ışığı döner. 4 sn al, 6 sn ver (meditasyonda 5-5). */

    <div class="nf-sahne"><svg viewBox="0 0 300 300" class="nf-svg" aria-hidden="true"><circle cx="150" cy="150" r="138" class="nf-iz"/><circle cx="150" cy="150" r="138" class="nf-ilerle" id="nfIl" stroke-dasharray="867" stroke-dashoffset="867"/>
      ${Array.from({length: 24}, (_, i) => `<circle cx="${150 + 118 * Math.cos(i / 24 * 2 * Math.PI)}" cy="${150 + 118 * Math.sin(i / 24 * 2 * Math.PI)}" r="1.4" class="nf-nok"/>`).join('')}</svg>

  let ac = null; const ses = (f) => { try{ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, ac.currentTime); g.gain.linearRampToValueAtTime(0.05, ac.currentTime + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 1.2); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 1.3); }catch(e){ /* yok */ } };

  const sira = [[al, 'Nefes alın', 1, 392], [tut1, 'Tutun', 1, 0], [ver, 'Verin', 0.5, 294], [tut2, 'Bekleyin', 0.5, 0]].filter(x => x[0] > 0);
  let i = 0;
  const adim = () => { const gecen = (Date.now() - bas) / 1000;

/* ------------------------------------------------------------------ seri şeridi (Bugün) */

/* ------------------------------------------------------------------ seri sayfası */
async function seriSayfa(){
  let y; try{ y = await api('/api/pt/oyun'); }catch(e){ return toast(e.message); }
  const TM = Object.fromEntries((y.takvim || []).map(g => [g.tarih, g])), bugD = new Date(bugunT() + 'T12:00');
  const pzt = new Date(bugD); pzt.setDate(bugD.getDate() - ((bugD.getDay() + 6) % 7) - 77);
  const T = Array.from({length: 84}, (_, i) => { const d = new Date(pzt); d.setDate(pzt.getDate() + i); const t = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    return TM[t] || {tarih: t, durum: d > bugD ? 'gelecek' : 'once'}; }), bos = 0;
  const es = y.sonraki_esik, onceki = [0, ...[3, 7, 14, 21, 30, 50, 75, 100, 150, 200, 250, 365, 500, 730, 1000]].filter(x => x <= y.seri).pop() || 0;
  const oran = es ? Math.round((y.seri - onceki) / Math.max(1, es - onceki) * 100) : 100;

    ${haftaNoktalari(y.hafta)}
    <p style="text-align:center;margin:10px 0 0;font-size:14.5px" class="${y.bugun.durum === 'tamam' ? '' : 'gri2'}">${esc(y.bugun.metin)}</p>
    ${es ? `<span class="etk">Sıradaki hedef: ${es} gün</span><div class="ilerbar"><b style="width:${oran}%"></b></div><small class="gri">${es - y.seri} gün kaldı</small>` : ''}
    <span class="etk">Seri koruması</span><div class="satir" style="gap:10px;flex-wrap:nowrap"><div class="seri-sag" style="margin:0">${korumaHtml(y)}</div>
      <span class="gri2" style="font-size:13.5px">${y.koruma ? `${y.koruma} koruma hazır: bir günü kaçırırsanız seri bozulmaz.` : 'Koruma yok: bugün kaçırırsanız seri kopar.'}${y.koruma_sonraki ? ` Sıradaki koruma ${y.koruma_sonraki} gün sonra.` : ''}</span></div>
    <span class="etk">Son 12 hafta</span><div class="stakvim">${HAFTA_HARF.map(h => `<span>${h}</span>`).join('')}${'<i class="bos"></i>'.repeat(bos)}${T.map(g => `<i class="${g.durum}" title="${tarihKisa(g.tarih)}: ${({tamam: 'tamam', onarildi: 'telafiyle onarıldı', korundu: 'korumayla geçti', kacti: 'kaçtı', bekliyor: 'bugün', once: 'seri başlamadan önce'})[g.durum] || ''}"></i>`).join('')}</div>
    ${(y.mukemmel_haftalar || []).length ? `<p class="gri2" style="font-size:13.5px;margin:8px 0 0">${y.mukemmel_haftalar.length} mükemmel hafta.</p>` : ''}
    <span class="etk">Rozetler · ${y.aileler.reduce((a, x) => a + x.seviye, 0)} seviye</span>${aileHtml(y.aileler)}
    ${y.rozetler.some(r => r.aile === 'ilk') ? `<span class="etk">İlkler</span>${rozetHtml(y.rozetler.filter(r => r.aile === 'ilk'))}` : ''}
    <span class="etk">Nasıl işliyor?</span>${y.kurallar.map(k => `<div class="not">${esc(k)}</div>`).join('')}
    <div class="salt"><button class="btn ana" data-kapat>Tamam</button></div>`);
  rozetBagla(p, y.rozetler.filter(r => r.aile === 'ilk')); aileBagla(p, y);

/* ------------------------------------------------------------------ rozetler */
function rozetHtml(L){

    return `<button class="roz ${v ? 'var' : ''} ${x.ikon === 'alev' ? 'alevli' : ''}" data-roz="${i}"><span class="daire">${rozIkon(x.ikon)}${!v && oran > 0 ? `<svg class="halka" viewBox="0 0 70 70"><circle cx="35" cy="35" r="${r}" fill="none" stroke="rgba(var(--vurgu-rgb),.7)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${cv}" stroke-dashoffset="${cv * (1 - oran)}"/></svg>` : ''}</span><b>${esc(x.ad)}</b></button>`; }).join('')}</div>`;
}
function rozetBagla(k, L){
  $$('[data-roz]', k).forEach(b => b.onclick = () => { const x = L[+b.dataset.roz];
    sayfa(`<div style="text-align:center"><div class="rozetler" style="display:flex;justify-content:center"><span class="roz ${x.kazanildi ? 'var' : ''} ${x.ikon === 'alev' ? 'alevli' : ''}"><span class="daire" style="width:84px;height:84px">${rozIkon(x.ikon)}</span></span></div>

      <div class="salt"><button class="btn ana" data-kapat>Tamam</button></div>`); });
}

/* ------------------------------------------------------------------ kutlama ekranı (seri uzadı, rozet, koruma, mükemmel hafta) */

function konfeti(){
  const k = document.createElement('div'); k.className = 'konfeti';
  const R = ['#C4F23A', '#ff9f43', '#ffcc33', '#7fc8ff', '#ffffff'];
  k.innerHTML = Array.from({length: 70}, () => `<i style="left:${Math.random() * 100}%;background:${R[Math.floor(Math.random() * R.length)]};animation-duration:${1.8 + Math.random() * 1.8}s;animation-delay:${Math.random() * .5}s;transform:rotate(${Math.random() * 360}deg)"></i>`).join('');
  document.body.appendChild(k); setTimeout(() => k.remove(), 4200);
}
function kutlamaKontrol(onceki){
  const y = S.o && S.o.oyun; if (!y || KUTLA_ACIK || $('#oyn')) return Promise.resolve();
  const bug = bugunT(), seriYeni = y.bugun.durum === 'tamam' && store.get('pt_seri_kutlandi', '') !== bug;
  const olaylar = (y.yeni || []).filter(o => !KUTLANAN.has(o.id));
  if (!seriYeni && !olaylar.length) return Promise.resolve();
  KUTLA_ACIK = true; olaylar.forEach(o => KUTLANAN.add(o.id));
  if (seriYeni) store.set('pt_seri_kutlandi', bug);
  return new Promise(coz => {
    const bas = seriYeni ? Math.max(0, onceki ?? y.seri - 1) : y.seri;
    const d = document.createElement('div'); d.className = 'kutla';
    d.innerHTML = `${seriYeni ? `${ALEV('alev buyukalev')}<div class="sayi" id="kSayi">${bas}</div><h2>${y.seri <= 1 ? 'Seri başladı.' : 'Seri uzadı.'}</h2>
        <p>${y.seri <= 1 ? 'Yarın da gelirseniz 2 gün olur.' : y.sonraki_esik ? `${y.sonraki_esik} güne ${y.sonraki_esik - y.seri} gün kaldı.` : ''}</p>${haftaNoktalari(y.hafta, 'bekliyor')}` : '<h2>Tebrikler.</h2>'}
      ${olaylar.map(olayHtml).join('')}<button class="btn ana" id="kDevam">Devam</button>`;
    document.body.appendChild(d);
    if (olaylar.length || [7, 14, 30, 50, 100, 365].includes(y.seri)) setTimeout(konfeti, seriYeni ? 700 : 100);
    if (seriYeni){
      bip(660, .08); setTimeout(() => bip(880, .12), 160);
      const el = $('#kSayi', d); let v = bas; const t = setInterval(() => { if (v >= y.seri) return clearInterval(t); v++; el.textContent = v; }, 280);

  });
}

const ZSIRA = ['itme', 'cekme', 'dips', 'amut_itme', 'bacak', 'kalca', 'kalca_kb', 'baldir', 'govde', 'plank', 'asili_govde', 'lsit', 'front_lever', 'amut'];
const TUR_FILTRE = [['tum', 'Hepsi'], ['kalistenik', 'Kalistenik'], ['bjj', 'BJJ'], ['flow', 'Animal flow'], ['mobilite', 'Mobilite'], ['isinma', 'Isınma']];
async function kitaplikVerisi(zorla){

const hKaslar = h => ((h.kart || {}).kaslar) || {};
function kitListe(){
  const kay = new Set(S.kit.kaydedilen), q = KF.q.toLocaleLowerCase('tr').trim(), ekip = new Set(S.o.profil.ekipman || []);
  const SIRA = ['kalistenik', 'bjj', 'flow', 'mobilite', 'isinma'];
  return Object.values(S.kat.katalog).filter(h => {
    const ks = hKaslar(h);
    if (KF.kas === 'kayitli' && !kay.has(h.kod)) return false;
    if (!['tum', 'kayitli'].includes(KF.kas) && !(ks.birincil || []).includes(KF.kas) && !(ks.ikincil || []).includes(KF.kas)) return false;
    if (KF.tur !== 'tum' && h.tur !== KF.tur) return false;

  $$('[data-aile]', k).forEach(b => b.onclick = () => { const a = y.aileler[+b.dataset.aile], R = y.rozetler.filter(r => r.aile === a.kod);

      <h3 style="margin-top:10px">${esc(a.ad)}</h3><p class="gri2" style="margin:0">${a.seviye ? `${a.seviye}. seviye · ${a.toplam} seviyeden` : 'Henüz seviye yok'}</p></div>
      ${a.sonraki ? `<span class="etk">Sıradaki: ${esc(a.sonraki.ad)}</span><div class="ilerbar"><b style="width:${Math.round(a.sonraki.oran * 100)}%"></b></div><small class="gri">${esc(a.sonraki.aciklama)} Şu an: ${a.deger}.</small>` : '<p style="text-align:center">Bütün seviyeler tamam.</p>'}
      <span class="etk">Seviyeler</span><div class="svliste">${R.map(r => `<div class="lsatir ${r.kazanildi ? '' : 'yok'}"><span class="roz ${r.kazanildi ? 'var' : ''} ${r.ikon === 'alev' ? 'alevli' : ''}"><span class="daire" style="width:40px;height:40px">${rozIkon(r.ikon)}</span></span><div class="lgovde"><b>${esc(r.ad)}</b><small>${esc(r.aciklama)}${r.kazanildi ? ` · ${tarihKisa(r.kazanildi)}` : ''}</small></div></div>`).join('')}</div>
      <div class="salt"><button class="btn ana" data-kapat>Tamam</button></div>`); });
}

/* ------------------------------------------------------------------ İlerleme: rozetler ve kas toparlanması */
async function rozetKartDoldur(){
  const el = $('#rozetKart'); if (!el) return;
  let y; try{ y = await api('/api/pt/oyun'); }catch(e){ el.innerHTML = '<span class="gri">Alınamadı.</span>'; return; }
  const top = y.aileler.reduce((a, x) => a + x.seviye, 0), max = y.aileler.reduce((a, x) => a + x.toplam, 0);
  const bas = $('#rozetBas'); if (bas) bas.innerHTML = `Rozetler <span>${top}/${max} seviye</span>`;
  const L = y.aileler.map((a, i) => ({...a, i})).sort((a, b) => String(b.son_tarih || '').localeCompare(String(a.son_tarih || '')) || (b.sonraki ? b.sonraki.oran : 0) - (a.sonraki ? a.sonraki.oran : 0)).slice(0, 6);
  el.innerHTML = `<div style="display:flex;gap:10px;overflow-x:auto;scrollbar-width:none" class="rozsira">${aileHtml(L).replace('<div class="rozetler">', '').replace(/<\/div>$/, '')}</div>
    <div class="satir ara" style="margin-top:10px"><span class="gri" style="font-size:13px">${top ? 'Son kazandıklarınız ve sıradakiler' : 'En yakın hedefleriniz'}</span><button class="metin" id="rozetHepsi">Hepsini gör</button></div>`;
  aileBagla(el, y);
  $('#rozetHepsi', el).onclick = () => { const I = y.rozetler.filter(r => r.aile === 'ilk');
    const p = sayfa(`<h3>Rozetler</h3><p class="gri2" style="margin:0 0 14px">${top} / ${max} seviye. Bir rozete dokunun: seviyeleri ve sıradakini görürsünüz.</p>${aileHtml(y.aileler)}${I.length ? `<span class="etk">İlkler</span>${rozetHtml(I)}` : ''}<div class="salt"><button class="btn ana" data-kapat>Tamam</button></div>`);
    aileBagla(p, y); rozetBagla(p, I); };
}
async function kasKartDoldur(){
  const el = $('#kasKart'); if (!el) return;
  const k = await kitaplikVerisi(true);
  const L = (k.kas || []).filter(x => x.son).sort((a, b) => a.taze - b.taze || b.set - a.set);
  if (!L.length){ el.innerHTML = '<p class="gri2" style="margin:0;font-size:14px">Antrenman kaydettikçe hangi kasların çalıştığını ve ne kadar toparlandığını burada görürsünüz.</p>'; return; }
  const durum = x => x.taze < .5 ? ['yorgun', 'Yorgun'] : x.taze < 1 ? ['topar', 'Toparlanıyor'] : ['hazir', 'Hazır'];
  el.innerHTML = `<div class="kasdur">${L.map(x => { const [c, a] = durum(x); return `<div class="${c}">${kasIkon(x.kas) ? `<img src="${kasIkon(x.kas)}" alt="">` : ''}<span><b>${esc(x.ad)}</b><small>${a} · bu hafta ${Math.round(x.set)} set</small></span></div>`; }).join('')}</div>
    <p class="gri" style="font-size:12.5px;margin:10px 0 0">Bir kas son 24 saatte çalıştıysa yorgun, 48 saatte toparlanıyor sayılır. Hızlı antrenmandaki "Önerilen" odak buna bakar.</p>`;
}

/* ------------------------------------------------------------------ çevrimdışı: bu haftanın videoları telefona */
async function videolariHazirla(){
  if (!('serviceWorker' in navigator) || !isSecureContext || !S.kat) return;
  try{ const r = await navigator.serviceWorker.ready; const videolar = new Set();
    (S.o.bugun.seanslar || []).concat([S.o.bugun.asgari]).forEach(s => (s && s.bolumler || []).forEach(b => (b.hareketler || []).forEach(h => { const k = kat(h.kod); if (k.video){ videolar.add(k.video); videolar.add(k.kapak); } })));
    const pl = JSON.parse(store.get('pt_plan', 'null')); ((pl && pl.program && pl.program.gunler) || []).forEach(g => (g.bolumler || []).forEach(b => (b.hareketler || []).forEach(h => { const k = kat(h.kod); if (k.video){ videolar.add(k.video); videolar.add(k.kapak); } })));
    /* bugünün ve haftanın hareket kareleri, anatomi görselleri ve koçun ses parçaları da (parkta görüntüsüz/sessiz kalmasın) */
    const ekle = kod => { const k = kat(kod); (k.kareler || []).forEach(x => { videolar.add(x.b); videolar.add(x.k); }); if (k.anatomi) videolar.add(k.anatomi.k); };
    (S.o.bugun.seanslar || []).concat([S.o.bugun.asgari]).forEach(s => (s && s.bolumler || []).forEach(b => (b.hareketler || []).forEach(h => ekle(h.kod))));
    ((pl && pl.program && pl.program.gunler) || []).forEach(g => (g.bolumler || []).forEach(b => (b.hareketler || []).forEach(h => ekle(h.kod))));
    Object.values(SES || {}).forEach(u => videolar.add(u));
    videolar.delete(undefined); videolar.delete(null); videolar.delete('');
    if (r.active && videolar.size) r.active.postMessage({tur: 'onbellek', adresler: [...videolar]});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  }catch(e){ /* yok */ }
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !mesgul()) yukle(true); });
